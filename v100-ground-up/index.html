<!doctype html>
<html lang="en">
<head>

<style>

<body>
<canvas id="map"></canvas>
<div id="top"><b>First Keep</b><span style="white-space:nowrap">v100 · 8</span><span id="clock" style="white-space:nowrap"></span><span id="store"></span><span id="seed"></span></div>
<script>
'use strict';
// First Keep v100 · floor 1: the ground. Every number below points at the dictionary (DICTIONARY.md); no number is written twice.
const D = { site: 3060, board: 2160, zone: [300, 600, 900], edge: 60, tile: 10, land: 24, sandTop: 12, dirtTop: 20, beach: 80, cliff: 4, wander: 24, sea: 60, day: 120, season: 180, year: 720, // D1, D2, D3–D6, D7, D12–D22
  bare: 12, wade: 4, lakes: [3, 6], lakeR: [50, 160], lakeDeep: 12, shore: 0.25, riverDeep: 8, riverW: 0.25, riverWander: 80, bank: 40, ford: 40, stream: 6, streamDeep: 2, // D23–D35
  hills: [2, 4], hillR: [80, 160], hillH: 14, rocks: [3, 6], rockR: [15, 35], rockH: 18, crevices: [1, 2], creviceW: 8, creviceFloor: 13, creviceL: [150, 300], lane: 50, middle: 150, // D36–D47
  forestScale: 500, forestShare: 0.1, wall: [920, 1080], pond: [700, 450], pondR: 50, // D48–D52
  treeWood: 100, bushFood: 125, goldPile: 800, stonePile: 350, ironPile: 350, ruinStone: 200, fireFood: 100, chestGold: 300, // D53–D60 what a shell holds
  ageUp: 500, villager: 50, mill: 100, lumber: 100, home: 25, barracks: 175, villagers: 6, homes: 2, margin: 0.25, // D61–D69 the prices Z1 is sized from (stand-ins until the Content pull)
  z1: { bush: [250, 140], tree: [140, 250], gold: [200, 120], stone: [120, 200] }, z3: { bush: [820, 300], tree: [300, 820], iron: [560, 680], stone: [450, 750], gold: [680, 560] }, z3x: 3, // D70–D72 the home spots, in the corner's frame
  goldZ4: [4, 6], stoneZ4: [3, 5], ironZ4: [3, 5], patches: [6, 10], patch: [4, 6], ruins: [2, 2], cemeteries: [1, 2], campfires: [2, 3], treasures: [1, 2], // D73–D81 Z4's finds
  jitter: 3, lod: 5, // D82 a thing's stand wanders in its tile by this much, D83 under this many pixels a tile things are dots and the grid is off
  tc: [380, 380], // D84 the Town Center's spot in the corner's frame (Z2, on the road)
  upm: 11.7, speed: { walk: 1.4, trot: 3.6, horse: 1.7, push: 0.7, deer: 1.5, wolf: 2.5, bear: 1.5 }, carry: 10, rate: { bush: 0.9, tree: 0.75, gold: 0.6, stone: 0.55, iron: 0.5 }, // D85 units a metre, D86 speeds in m/s, D87 a load, D88 gathering a second
  next: 100, herds: [3, 5], herd: [3, 5], packs: [2, 3], pack: [2, 3], wait: 6, reach: 60, steps: 6, beat: 0.4, fps: 30, // D89 the next find within, D90–D93 the wildlife, D94 a wander's mean wait, D95 its reach, D96 walk frames a second, D97 a work beat, D98 frames a second
  lat: 45, temps: [10, 22, 12, -6], swing: 6, chain: [0.12, 0.65], stormShare: 0.25, wetUp: 20, dryOut: 50, mud: 0.8, snowCost: 0.6, // D99 the latitude, D100 the seasons' mean °C, D101 the day's swing, D102 P(wet|dry), P(wet|wet) an hour, D103 storms among wet hours, D104–D105 wet and dry settle, D106 walking costs
  snowfall: 0.03, melt: 0.004, bears: 200, fogWait: 240, fogLast: 40, flashGap: 0.34, strike: 6, marshes: [1, 2], marshW: 40, fast: 8, // D107 snow a second, D108 melt a °C·s, D109 ice bears at this many °C·s, D110–D111 fog's wait and stay, D112 between flashes, D113 between strikes, D114 marshy lakes, D115 a marsh's width, D116 Fast
  sight: { unit: 60, bld: 100 }, fogDim: [0.75, 0.4], fogTick: 0.5, shadowMax: 3, blades: 0.45,
  players: [0, 2], woodsKeep: 64 }; // D122 the sides in play: you and one computer, opposite corners; D164 woods chunks kept drawn (more than a screen shows at any zoom) // D117 how far a unit and a building see, D118 the fog's dark over the unseen and the seen, D119 the fog's beat, D120 a shadow at most this many heights, D121 the blades' strength
const A = { turn: 15, rise: 30, repose: 34 }; // A1 the grid's turn, A2 the camera's rise, A3 the angle of repose
const C = { water: '#2a6488', sand: '#cdbb88', dirt: '#785c3a', grass: '#4a6634', blue: '#6aaeff', green: '#5fd08a', red: '#ff6b5b', white: '#ece5d3', gold: '#e6b947' }; // C1–C8, C10

// ── The frames (QBD). The grid is square in its own frame; the board frame is the grid turned A1 about the site's middle; the view foreshortens depth by sin A2 and shows height by cos A2.
const RAD = Math.PI / 180, N = D.site / D.tile, MID = D.site / 2, B0 = (D.site - D.board) / 2, B1 = B0 + D.board;
const COS = Math.cos(A.turn * RAD), SIN = Math.sin(A.turn * RAD), TILT = Math.sin(A.rise * RAD), UP = Math.cos(A.rise * RAD);
const REPOSE = Math.tan(A.repose * RAD) * D.tile; // QBE: the most a tile may step up or down over its own width and still be a slope
const SKEW = TILT * SIN, ART_T = TILT * COS + SKEW * SIN, ART_S = SIN / ART_T; // QBK the art frame: a building is painted with its front along x and sheared by SKEW so that edge follows the grid; its depth is ART_T a unit of width, the back standing ART_S of that to the right
const toBoard = (sx, sy) => { const x = sx - MID, y = sy - MID; return [MID + x * COS - y * SIN, MID + x * SIN + y * COS]; };
const fromBoard = (bx, by) => { const x = bx - MID, y = by - MID; return [MID + x * COS + y * SIN, MID - x * SIN + y * COS]; };
const toView = (bx, by, h) => [bx, by * TILT - h * UP];
const V = (sx, sy, h) => { const [bx, by] = toBoard(sx, sy); return toView(bx, by, h); };
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const shade = (hex, f) => '#' + [1, 3, 5].map((i) => clamp(Math.round(parseInt(hex.slice(i, i + 2), 16) * f), 0, 255).toString(16).padStart(2, '0')).join('');

// ── QBF the dice (N65): one seed, Mulberry32. Every roll names Who, What, Where, When, Why and How beside it (L13).
function dice(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), a | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// QAZ a fractal line (N60): K waves, the k-th of amplitude k^(−H), H = 2 − Dim; a coast's Dim is about 1.25. Returns a function of the way along, in radians, giving −1 to 1.
function fractal(roll, K, Dim) { const H = 2 - Dim, ph = Array.from({ length: K }, () => roll() * 2 * Math.PI); let norm = 0; for (let k = 1; k <= K; k++) norm += k ** -H; return (t) => { let v = 0; for (let k = 1; k <= K; k++) v += k ** -H * Math.sin(k * t + ph[k - 1]); return v / norm; }; }

// QAZ as a surface: K plane waves in rolled directions, the same amplitudes; scale is the longest wave in units. Returns a function of (x, y) giving about −1 to 1.
function fractal2(roll, K, Dim, scale) { const H = 2 - Dim, w = Array.from({ length: K }, (_, k) => [roll() * 2 * Math.PI, roll() * 2 * Math.PI, (k + 1) ** -H, ((k + 1) / scale) * 2 * Math.PI]); let norm = 0; for (const q of w) norm += q[2]; return (x, y) => { let v = 0; for (const [th, ph, a, f] of w) v += a * Math.sin((x * Math.cos(th) + y * Math.sin(th)) * f + ph); return v / norm; }; }

// ── The coast (L2 Cut at the board's edge; L4 Edge). Where it stands out it is a headland and a cliff, where it bends in a bay and a beach (QBG).
// The roll: Who the map · What how far the coast wanders in and out · Where the coast only; within D5 of every corner the same wander (L12), free along the middle of each side · When the map is made · Why no two maps share a coast, and every home gets the same one · How QAZ on the dice.
function makeCoast(roll) {
  const home = fractal(roll, 10, 1.25), free = [0, 1, 2, 3].map(() => fractal(roll, 10, 1.25)), Z3 = D.zone[2], BLEND = D.edge;
  return (side, pos) => { // pos: the way along the side from its start; returns [wander, cliffness]
    const s = Math.min(pos, D.board - pos), w = clamp((s - Z3) / BLEND, 0, 1);
    const out = (1 - w) * home((s / Z3) * Math.PI) + w * free[side]((pos / D.board) * 2 * Math.PI); // −1 bay to 1 headland
    return [D.wander * out, clamp((out - 0.2) / 0.3, 0, 1)];
  };
}

// ── The ground: one height a tile. Depth is the way in from the coast (negative at sea). Land stands at D13; a beach falls to the water over D16, a cliff over D17 (L4); the sea deepens with distance. The stratum a tile shows is whichever its height reaches (L1).
const H = new Float32Array(N * N), DEP = new Float32Array(N * N), CH = new Float32Array(N * N * 4), FOR = new Uint8Array(N * N); // height, depth from the coast, the four drawn corner heights, the forest floor
let coast, seed, lakes = []; const MARSH = new Uint8Array(N * N); // marsh (TW1): always wet (KI1)
function depthAt(bx, by) { // the way in from the coast at a board point, and the coast's cliffness there
  const dl = bx - B0, dr = B1 - bx, dt = by - B0, db = B1 - by, dx = Math.min(dl, dr), dy = Math.min(dt, db);
  const side = dx < dy ? (dl < dr ? 0 : 1) : dt < db ? 2 : 3, pos = clamp(dx < dy ? by - B0 : bx - B0, 0, D.board);
  const [wander, e] = coast(side, pos);
  return [Math.min(dx, dy) - wander, e];
}
function makeGround(sd) {
  seed = sd; const roll = dice(sd); coast = makeCoast(roll);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const [bx, by] = toBoard((i + 0.5) * D.tile, (j + 0.5) * D.tile), [depth, e] = depthAt(bx, by), run = D.beach + (D.cliff - D.beach) * e;
    DEP[j * N + i] = depth;
    H[j * N + i] = depth >= run ? D.land : depth > 0 ? (D.land * depth) / run : depth;
  }
  makeTerrain(roll);
  // the drawn corners (QBE): at every grid corner the tiles round it are sorted by height and split where a step passes the angle of repose; each group shares one height, so a slope meets without a crack and a face stands where it should
  const dh = (i, j) => (i < 0 || j < 0 || i >= N || j >= N ? 0 : Math.max(0, H[j * N + i]));
  for (let cj = 0; cj <= N; cj++) for (let ci = 0; ci <= N; ci++) {
    const round = [[ci - 1, cj - 1, 3], [ci, cj - 1, 2], [ci - 1, cj, 1], [ci, cj, 0]].filter(([i, j]) => i >= 0 && j >= 0 && i < N && j < N).map(([i, j, slot]) => [dh(i, j), (j * N + i) * 4 + slot]).sort((a, b) => a[0] - b[0]);
    for (let a = 0; a < round.length; ) { let b = a + 1; while (b < round.length && round[b][0] - round[b - 1][0] <= REPOSE) b++; let sum = 0; for (let q = a; q < b; q++) sum += round[q][0]; for (let q = a; q < b; q++) CH[round[q][1]] = sum / (b - a); a = b; }
  }
  makeThings(roll); makeBuildings(); makeMarsh(roll);
  renderGround();
  document.getElementById('seed').textContent = 'map ' + sd;
}

// ── Floor 2, terrain (layer 90): every piece is a Cut or a Raise on the one height field (L2, L3); the layer that shows follows (L1), a step past the angle of repose is a face (QBE).
const CORNERS = [[B0, B0], [B1, B0], [B1, B1], [B0, B1]];
const corner = (c, u, v) => { const [cx, cy] = CORNERS[c], a = c * 90 * RAD; return [cx + u * Math.cos(a) - v * Math.sin(a), cy + u * Math.sin(a) + v * Math.cos(a)]; }; // a spot in a corner's own frame (u along one edge, v along the other), the same in all four (L12)
const cornerDist = (bx, by) => Math.min(...CORNERS.map(([cx, cy]) => Math.hypot(bx - cx, by - cy)));
const segDist = (px, py, ax, ay, bx, by) => { const vx = bx - ax, vy = by - ay, t = clamp(((px - ax) * vx + (py - ay) * vy) / (vx * vx + vy * vy), 0, 1); return Math.hypot(px - ax - t * vx, py - ay - t * vy); };
const laneDist = (bx, by) => Math.min(...CORNERS.map(([cx, cy]) => segDist(bx, by, cx, cy, MID, MID))); // the four roads: corner to middle
const tileAt = (bx, by) => { const [sx, sy] = fromBoard(bx, by); const i = Math.floor(sx / D.tile), j = Math.floor(sy / D.tile); return i < 0 || j < 0 || i >= N || j >= N ? -1 : j * N + i; };
const landAt = (bx, by) => { const k = tileAt(bx, by); return k >= 0 && H[k] >= D.land && FOR[k] === 0; };
const inZ4 = (bx, by, r) => cornerDist(bx, by) >= D.zone[2] + r && depthAt(bx, by)[0] >= D.edge + r && Math.hypot(bx - MID, by - MID) >= D.middle + r && laneDist(bx, by) >= D.lane + r;
function stamp(bx, by, r, fn) { // every tile whose middle lies within r of a board point: fn(k, d, dx, dy)
  const box = [[bx - r, by - r], [bx + r, by - r], [bx - r, by + r], [bx + r, by + r]].map(([x, y]) => fromBoard(x, y));
  const i0 = Math.max(0, Math.floor(Math.min(...box.map((p) => p[0])) / D.tile)), i1 = Math.min(N - 1, Math.ceil(Math.max(...box.map((p) => p[0])) / D.tile));
  const j0 = Math.max(0, Math.floor(Math.min(...box.map((p) => p[1])) / D.tile)), j1 = Math.min(N - 1, Math.ceil(Math.max(...box.map((p) => p[1])) / D.tile));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { const [tx, ty] = toBoard((i + 0.5) * D.tile, (j + 0.5) * D.tile), dx = tx - bx, dy = ty - by, d = Math.hypot(dx, dy); if (d <= r) fn(j * N + i, d, dx, dy); }
}
const between = (roll, [lo, hi]) => lo + roll() * (hi - lo), count = (roll, [lo, hi]) => Math.floor(between(roll, [lo, hi + 1]));
// a lake: a bowl (deep at the middle, D27) inside a fractal shore (QAZ, D28); where the land stands out into it the shore is a face, where it bends back a bank (QBG); a lake's bank falls over D32, the sea's beach over D16 (L4)
function lake(bx, by, r, rim, deep) {
  stamp(bx, by, r * (1 + D.shore) + D.bank, (k, d, dx, dy) => {
    const out = rim(Math.atan2(dy, dx)), edge = r * (1 + D.shore * out), cliff = clamp((-out - 0.2) / 0.3, 0, 1), run = D.bank + (D.cliff - D.bank) * cliff;
    const h = d < edge ? -deep * (1 - (d / edge) ** 2) : (D.land * (d - edge)) / run;
    H[k] = Math.min(H[k], h);
  });
}
// a wandering line (QAZ) from a to b, pinned at both ends; null when any point fails ok
function wanderLine(roll, a, b, wander, ok) {
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]), nx = -(b[1] - a[1]) / len, ny = (b[0] - a[0]) / len, f = fractal(roll, 6, 1.3), pts = [];
  for (let t = 0; t <= 1; t += 4 / len) { const s = wander * f(t * Math.PI) * Math.sin(t * Math.PI); pts.push([a[0] + (b[0] - a[0]) * t + nx * s, a[1] + (b[1] - a[1]) * t + ny * s]); }
  return ok && !pts.every(([x, y]) => ok(x, y)) ? null : pts;
}
// a channel: discs along a line; w the half-width, deep the bed; the bank falls over D32
const channel = (pts, w, deep) => { for (const [x, y] of pts) stamp(x, y, w + D.bank, (k, d) => { H[k] = Math.min(H[k], d < w ? -deep * (1 - (d / w) ** 2) : (D.land * (d - w)) / D.bank); }); };
const dome = (bx, by, r, hgt) => stamp(bx, by, r, (k, d) => { H[k] = Math.max(H[k], D.land + hgt * (1 - (d / r) ** 2) ** 2); }); // a smooth hill: its steepest slope is 0.77 h / r, under the angle of repose at these numbers
function makeTerrain(roll) {
  // The home pond: Who every corner · What one small lake · Where Z3, the same spot in each corner's own frame (D51, D52, L12) · When the map is made · Why a home has water to fish and to sail, and the same water for all · How one shore rolled once (QAZ), shared
  const pondRim = fractal(roll, 8, 1.3);
  for (let c = 0; c < 4; c++) lake(...corner(c, ...D.pond), D.pondR, pondRim, D.lakeDeep);
  // Lakes: Who the map · What their number, size and place · Where Z4, off the roads and the middle, inside the play edge · When the map is made · Why no two maps share their water · How a count between D25, sizes on the power law of lakes (QBA, Pareto draw), places uniform, each shore QAZ
  lakes = []; const c = 1.06, amin = Math.PI * D.lakeR[0] ** 2, amax = Math.PI * D.lakeR[1] ** 2;
  for (let n = count(roll, D.lakes), tries = 0; lakes.length < n && tries < 200; tries++) {
    const r = Math.sqrt(Math.min(amax, amin * roll() ** (-1 / c)) / Math.PI), bx = between(roll, [B0, B1]), by = between(roll, [B0, B1]), room = r * (1 + D.shore) + D.bank;
    if (!inZ4(bx, by, room) || lakes.some((L) => Math.hypot(L.x - bx, L.y - by) < L.r + room + 2 * D.beach)) continue;
    lakes.push({ x: bx, y: by, r }); lake(bx, by, r, fractal(roll, 8, 1.3), D.lakeDeep);
  }
  // Rivers: Who the map · What one from each lake big enough, to the nearest free coast · Where Z4 only; a river never enters a home (L12) · When the map is made · Why water that moves, a way to sail out, a line to hold · How the path wanders (QAZ), the width grows with the lake (QBB)
  const mouths = (bx, by) => { let best = null; for (const [sx, sy, ex, ey] of [[B0, B0 + 900, B0, B1 - 900], [B1, B0 + 900, B1, B1 - 900], [B0 + 900, B0, B1 - 900, B0], [B0 + 900, B1, B1 - 900, B1]]) { const t = clamp(((bx - sx) * (ex - sx) + (by - sy) * (ey - sy)) / ((ex - sx) ** 2 + (ey - sy) ** 2), 0, 1), px = sx + (ex - sx) * t, py = sy + (ey - sy) * t, d = Math.hypot(px - bx, py - by); if (!best || d < best[2]) best = [px, py, d]; } return best; };
  const rivers = [];
  for (const L of lakes) if (L.r >= D.lakeR[0] * 1.5) {
    const [mx, my] = mouths(L.x, L.y), w = D.riverW * L.r, dx = mx - L.x, dy = my - L.y, len = Math.hypot(dx, dy);
    const pts = wanderLine(roll, [L.x, L.y], [mx + (dx / len) * (D.wander + D.beach), my + (dy / len) * (D.wander + D.beach)], D.riverWander, (x, y) => cornerDist(x, y) >= D.zone[2] + w + D.bank && Math.hypot(x - MID, y - MID) >= D.middle);
    if (pts) { channel(pts, w, D.riverDeep); rivers.push({ pts, w }); }
  }
  // Fords (TC4): Who every river · What a shallow crossing · Where wherever a river crosses one of the four roads, and once more at a rolled spot · When with the river · Why towns grew at fords: a road meets water where it can be waded · How the bed raised to wading depth over D33
  for (const R of rivers) {
    const spots = R.pts.filter(([x, y]) => laneDist(x, y) < D.lane); const one = R.pts[Math.floor(between(roll, [R.pts.length * 0.3, R.pts.length * 0.7]))];
    for (const [x, y] of [...spots.filter((p, n) => n % 10 === 0), one]) stamp(x, y, R.w + D.ford / 2, (k) => { if (H[k] < -D.wade / 2) H[k] = -D.wade / 2; });
  }
  // Hills (TR1): Who the map · What a few smooth rises · Where Z4, clear of water and roads · When the map is made · Why high ground to hold and to see from · How count D36, radius D37, a dome of D38
  const hills = [];
  for (let n = count(roll, D.hills), tries = 0; hills.length < n && tries < 100; tries++) { const r = between(roll, D.hillR), bx = between(roll, [B0, B1]), by = between(roll, [B0, B1]);
    if (!inZ4(bx, by, r) || !landAt(bx, by) || !landAt(bx + r, by) || !landAt(bx - r, by) || !landAt(bx, by + r) || !landAt(bx, by - r)) continue; hills.push([bx, by, r]); dome(bx, by, r, D.hillH); }
  // Streams (TC3): Who each hill · What a thin, wadeable run to the nearest lake · Where Z4 · When with the hills · Why water springs where ground rises · How a channel of D34 by D35
  for (const [hx, hy, hr] of hills) { let best = null; for (const L of lakes) { const d = Math.hypot(L.x - hx, L.y - hy); if (!best || d < best[1]) best = [L, d]; }
    if (best) { const L = best[0], dx = L.x - hx, dy = L.y - hy, len = Math.hypot(dx, dy), pts = wanderLine(roll, [hx + (dx / len) * hr, hy + (dy / len) * hr], [L.x, L.y], D.riverWander / 2, (x, y) => cornerDist(x, y) >= D.zone[2]); if (pts) channel(pts, D.stream, D.streamDeep); } }
