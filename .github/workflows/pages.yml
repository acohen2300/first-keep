# The lock on GitHub's side: every push runs v100's gate; the site is deployed only when it passes. A failed gate deploys nothing,
# so the last good site keeps serving (live, preview, v70 and v100 alike). Needs Settings › Pages › Source: GitHub Actions.
name: gate and pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: v100's gate (books, molds, seals, parse, swallowed code, the pages written by hand)
        run: python3 v100-ground-up/index.py --ci
  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: v100 served as one stitched page, so a phone can never run a new page beside an old book (Albert, Nov 9); the source stays split
        run: |
          python3 - <<'PY'
          import re, pathlib
          d = pathlib.Path('frankenstein-refresh/v100'); page = (d / 'index.html').read_text(encoding='utf-8')
          js = lambda m: '<script>' + (d / m.group(1)).read_text(encoding='utf-8').replace('</script', '<\\/script') + '</script>'
          page = re.sub(r'<script src="([\w/.-]+\.js)"></script>', js, page)
          page = page.replace('<link rel="stylesheet" href="fonts.css">', '<style>' + (d / 'fonts.css').read_text(encoding='utf-8') + '</style>')
          assert '<script src=' not in page and 'href="fonts.css"' not in page
          (d / 'index.html').write_text(page, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
