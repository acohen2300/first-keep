<style>
/* One screen, a war table at night: the map fills it, and the tally and the orders float on top as woad-indigo pills with a gold hairline. */
:root{
  --ink:#121715; --panel:#1b221f; --panel2:#232c28; --line:#34413b; --bone:#ece5d3; --mute:#a7b1aa; --dim:#909a93;
  --blue:#4f93e6; --red:#de5a44; --gold:#e6b947;
  --hb:calc(max(8px,env(safe-area-inset-top,0px)) + 78px); --ob:140px; --pad:8px;
  --row:44px; --strip:28px; --t2:12px; --r:8px; --hair:var(--line); --sheet:rgba(27,34,31,.94);
  --display:"IM Fell English SC", Georgia, "Times New Roman", serif;
  --ui:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--ui);font-size:15px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;position:relative;max-width:560px;margin:0 auto}
/* One mold for every control: .cell. A pill is a row of cells touching; a tile is one cell in its own box. Icon on the top line, word on the second, the same two spots everywhere. */
#hud{position:absolute;top:max(8px,env(safe-area-inset-top,0px));left:0;right:0;box-sizing:border-box;padding:0 var(--pad);display:flex;flex-direction:column;gap:4px;pointer-events:none}#hud>*{pointer-events:auto}
.pill{display:flex;box-sizing:border-box;height:calc(var(--row) + 2px);border:1px solid var(--hair);border-radius:var(--r);background:var(--sheet);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.cell{position:relative;flex:1 1 0;min-width:0;height:var(--row);box-sizing:border-box;color:var(--bone)}
button.cell{all:unset;box-sizing:border-box;position:relative;flex:1 1 0;min-width:0;height:var(--row);color:var(--bone);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button.cell:focus-visible,.strip button:focus-visible,button.fab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.pill .cell+.cell::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--hair)}
.gl{position:absolute;left:50%;top:13px;width:20px;height:20px;transform:translate(-50%,-50%);display:block}
.wd{position:absolute;left:0;right:0;top:33px;transform:translateY(-50%);text-align:center;font-size:var(--t2);font-weight:700;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.cell.one .gl,.cell.one .wd{top:50%}.cell.one .gl{width:18px;height:18px}
.pill .cell.on{background:#2f3b36}
#muteB .x,#muteB.off .w{display:none}#muteB.off .x{display:inline}#muteB.off{color:var(--mute)}
.strip{display:flex;align-items:flex-start;justify-content:space-between;box-sizing:border-box;height:var(--strip);border:1px solid var(--hair);border-radius:var(--r);background:var(--sheet);box-shadow:0 2px 8px rgba(0,0,0,.35);padding:0 2px;font-size:var(--t2);font-weight:700;color:var(--mute);line-height:26px}   /* 28 px tall to look at, 44 px tall to tap: the buttons hang below it */
.strip .sg{display:flex;align-items:flex-start}
.strip button{all:unset;display:flex;align-items:flex-start;justify-content:center;box-sizing:border-box;height:44px;min-width:44px;padding:0 8px;text-align:center;white-space:nowrap;cursor:pointer;touch-action:manipulation;font-variant-numeric:tabular-nums}
#scoreP{gap:4px}#sIdle{color:var(--gold)}#scoreN{color:var(--bone)}
#sAge.glow{color:var(--gold);animation:glowt 1.8s ease-in-out infinite}@keyframes glowt{0%,100%{text-shadow:0 0 3px rgba(230,185,71,.35)}50%{text-shadow:0 0 12px rgba(230,185,71,1)}}
#card .lvl{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}#card .lvl small{color:var(--mute)}
/* The ticker: every message and tip in one line under the strip, the newest first; tap it to see it, the list for the last five, the arrow to hide them all (a bell in the strip counts what comes while hidden). Albert, Build 39 */
.tick{display:flex;box-sizing:border-box;height:46px;border:1px solid var(--hair);border-radius:var(--r);background:var(--sheet);box-shadow:0 2px 8px rgba(0,0,0,.35);overflow:hidden;color:var(--bone)}
.tick button,.tkpop button{all:unset;box-sizing:border-box;min-height:44px;cursor:pointer;touch-action:manipulation}
#tkT{flex:1;min-width:0;padding:0 10px;font-size:15px;font-weight:500;line-height:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tkList,#tkMin,.tkpop .h{width:44px;display:flex;align-items:center;justify-content:center;color:var(--mute)}#tkList .n{font-size:12px;font-weight:700;margin-left:2px;color:var(--gold)}#tkList.warn .n{color:#ff8a70}
.tick.alert.hot{background:rgba(92,22,18,.96);color:#ffd9d2;border-color:#d8432f}.tick.alert.hot #tkList,.tick.alert.hot #tkMin{color:#ffd9d2}
.tick.alert{background:rgba(70,48,12,.96);color:#fbe7b8;border-color:var(--gold)}.tick.alert #tkList,.tick.alert #tkMin{color:#fbe7b8}
#tkT .al{display:flex;align-items:center;gap:6px;height:44px}#tkT .al b{flex:none;font-weight:700}#tkT .al i{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:500;opacity:.92}
#tkT .tri{flex:none;width:16px;height:16px;color:#ffc24a}#tkT .cd{flex:none;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.ring{width:20px;height:20px;transform:rotate(-90deg)}.ring circle{fill:none;stroke:currentColor;stroke-width:2.6;opacity:.28}.ring .v{opacity:1;stroke-dasharray:50.27;stroke-linecap:round}
.tick.warn{background:rgba(124,32,22,.95);color:#ffe1da}.tick.warn #tkList,.tick.warn #tkMin{color:#ffe1da}.tick.good{background:rgba(28,84,58,.95);color:#dcf5e8}.tick.tip{border-color:var(--blue)}.tick.old #tkT{color:var(--mute)}
.tkpop{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:var(--r);background:var(--sheet);box-shadow:0 2px 8px rgba(0,0,0,.35);overflow:hidden}
.tkpop .row{display:flex}.tkpop .row+.row{border-top:1px solid var(--hair)}.tkpop .t{flex:1;min-width:0;padding:6px 10px;display:flex;align-items:center;font-size:12px;font-weight:700;line-height:1.25;color:var(--bone)}.tkpop .row.warn .t{color:#ffb4a6}.tkpop .row.good .t{color:#9fd8b5}
#tkBell{gap:4px;color:var(--gold)}#tkBell.warn{color:#ff8a70}#tkBell .gl{position:static;transform:none;width:15px;height:26px;margin:0}
.tick .gl,.tkpop .gl{position:static;transform:none;width:16px;height:16px}   /* icons sit in their own button, not on the tally's spots */
#hud{z-index:4}   /* the ticker and its list above the small map */
.hi{width:16px;height:16px}
#stage.tk{--hb:calc(max(8px,env(safe-area-inset-top,0px)) + 128px)}   /* the ticker shown: everything under the top bars moves down by its height */
#stage{position:absolute;inset:0;overflow:hidden;background:#20301c;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse farthest-corner at 50% 50%,rgba(0,0,0,0) 42%,rgba(0,0,0,.3) 100%)}
#mini{position:absolute;top:calc(var(--hb) + 8px);right:8px;width:86px;height:86px;border:1px solid rgba(236,229,211,.5);border-radius:4px;background:#000}
#card.full{max-height:calc(100% - var(--ob) - var(--hb) - 14px)}
#place{position:absolute;left:8px;right:8px;bottom:calc(var(--ob) + 8px);display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(18,23,21,.94);border:1px solid var(--gold);border-radius:8px;padding:6px 6px 6px 10px;font-weight:700}
#strip{position:absolute;display:flex;gap:4px;padding:4px;background:rgba(18,23,21,.94);border:1px solid var(--gold);border-radius:10px;z-index:5;max-width:calc(100% - 8px);overflow-x:auto}
#strip[hidden]{display:none}#strip{flex-wrap:wrap}#strip .sn{flex:0 0 100%;width:0;min-width:100%;font-size:12px;color:var(--mute);text-align:center;padding:0 4px 2px;white-space:normal;line-height:1.2}#strip button{min-height:44px;min-width:44px;padding:2px 8px;flex:0 0 auto}#strip button.ic{width:44px;padding:0;font-size:19px;font-weight:700}#strip .gl{position:static;transform:none;width:18px;height:18px;display:block}#strip{gap:4px;padding:4px}#strip button b{font-size:12px}#strip button small{font-size:12px}
#place span{flex:1;min-width:0;line-height:1.25}
#place button{min-height:44px;padding:0 12px}
#card{box-sizing:border-box;position:absolute;left:6px;right:6px;bottom:calc(var(--ob) + 6px);max-height:min(62%,calc(100% - var(--ob) - var(--hb) - 14px));overflow-y:auto;background:rgba(24,30,27,.97);border:1px solid var(--line);border-radius:10px;padding:6px 8px 8px;display:flex;flex-direction:column;gap:4px;box-shadow:0 -6px 24px rgba(0,0,0,.45)}
#card h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;display:flex;align-items:center;gap:8px;padding-right:96px;min-height:40px}   /* as tall as the book and the close, so neither hangs over the first row */
#card .who{font-family:var(--ui);font-size:13px;color:var(--mute);font-weight:700}
#card p{margin:0;color:var(--mute);line-height:1.35;font-size:16px}
#card p i{color:var(--bone);font-style:normal;font-weight:700}
#card .fold{border-top:1px solid #2a332e;padding-top:2px}
#card .fold summary{color:var(--mute);font-size:13px;min-height:44px;display:flex;align-items:center;cursor:pointer;list-style:none}
#card .fold summary::-webkit-details-marker{display:none}
#card .fold summary::before{content:'+';display:inline-block;width:18px;font-weight:700}
#card .fold[open] summary::before{content:'−'}
#card .fold p{margin-top:4px}
#card .hp{height:5px;background:#0b0e0c;border-radius:3px;overflow:hidden}

#card .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
#card .acts.c1{grid-template-columns:1fr}
#card .acts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
#card .acts.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
#card .sec{font-size:13px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
#card .g{border-top:1px solid var(--line);padding-top:5px;display:flex;flex-direction:column;gap:3px}
#card .g b{font-size:16px;font-weight:700}
#card .g small{color:var(--dim);font-size:13px;white-space:normal}
#card table{color:var(--bone);border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;width:100%}
#card td,#card th{padding:3px 4px;text-align:right;border-bottom:1px solid var(--line)}
#card td:first-child,#card th:first-child{text-align:left}

#card .done{color:#9fd8b5}
#card .chips{display:flex;flex-wrap:wrap;gap:5px}
#card .chip{border:1px solid #4fb06a;box-shadow:inset 0 0 0 1px #4fb06a;color:#dcf5e8;border-radius:12px;padding:3px 9px;font-size:13px;font-weight:700}
#card .dim{color:var(--mute)}
#card .copy{text-align:center;font-size:13px;margin:6px 0 0}
#cardI{position:absolute;top:4px;right:52px;min-height:44px;min-width:44px;padding:0;background:none;border:0}
#cardX{position:absolute;top:4px;right:4px;min-height:44px;min-width:44px;padding:0;font-size:20px;background:none;border:0}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(18,23,21,.86);text-align:center;padding:0 16px}
#end h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0}
#end p{margin:0;color:var(--mute);font-size:15px}
#card .qs{display:grid;grid-template-columns:1fr 44px 76px 44px;gap:4px;align-items:center;margin:2px 0}
#card .qs span{text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
#card .qs button{padding:0;font-size:20px;font-weight:700;min-height:44px}
#endActs{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}#endActs button small{white-space:normal}
#orders{position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:0 var(--pad) max(8px,env(safe-area-inset-bottom,0px));pointer-events:none}
#orders .tiles{pointer-events:auto}
button.ghost{visibility:hidden}
.tr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
#buildT .gl{position:static;transform:none;width:18px;height:18px;display:block;margin:auto}
.col{display:flex;flex-direction:column;gap:3px;min-width:0}.col>button.cell{flex:none}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.tiles button.cell{background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tiles button.cell.sel{background:#2f3b36;border-color:var(--mute)}
.tiles button.cell.dis{color:var(--dim)}
.tiles .st{font-size:19px;font-weight:700;line-height:calc(var(--row) - 2px);text-align:center}
.tiles .top{position:absolute;left:0;right:0;top:13px;transform:translateY(-50%);display:flex;justify-content:center;align-items:center;gap:4px}
.tiles .top .gl{position:static;transform:none;width:16px;height:16px}
.tiles .top .c{font-size:15px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tiles .wd{color:var(--mute)}.tiles .sel .wd{color:var(--bone)}
#tPeople .gl{width:20px;height:20px}
#tPeople .wd{color:var(--bone)}
/* the attack cards: the same dark glass, hairlines and one amber accent as the huddle bar */
#card.hud{background:rgba(10,13,15,.9);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);border-radius:14px;box-shadow:none}
#card.hud h3{font-family:inherit;font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#ffb23d}
#card.hud .who{color:#98a2a6;letter-spacing:.08em}
#card.hud p{color:#e6e9e6;font-variant-numeric:tabular-nums}#card.hud p b{display:inline-block;min-width:64px;color:#98a2a6;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
#card.hud .acts button{background:#161b1f;border:1px solid rgba(255,255,255,.09);border-radius:10px;box-shadow:none;color:#e6e9e6}
#card.hud .acts button.go{border-color:#ffb23d;color:#ffb23d}#card.hud .acts button.warn{border-color:#ff5a4a;color:#ff9a8c}#card.hud .acts button.dis{opacity:.5}
#card.hud .acts small{color:#98a2a6}
#jobs[hidden],#huddle[hidden]{display:none}
/* the huddle: dark flat glass, hairlines, one amber accent; only while planning an attack. A lamp line on top of a button: red not set, green set */
#orders.hud{background:rgba(10,13,15,.82);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.09)}
#huddle button.cell{position:relative;overflow:hidden;background:#161b1f;border:1px solid rgba(255,255,255,.09);border-radius:10px;box-shadow:none;color:#e6e9e6}
#huddle .wd{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#98a2a6}#huddle .wd.mid{top:50%}
#huddle .top .c{font-size:20px}
#huddle .st.w{font-size:12px;letter-spacing:.08em;text-transform:uppercase;line-height:calc(var(--row) - 2px)}
#huddle .bar::after,#huddle .msn:not(.empty):first-child::after{content:'';position:absolute;left:10px;right:10px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--mc,#e0503f)}
#huddle .bar.on{--mc:#4fe0a0}#huddle .bar.on::after{box-shadow:0 0 8px #4fe0a0}
#huddle .cell.sel{border-color:#ffb23d}
#huddle .fire.go{background:#ffb23d;border-color:#ffb23d;box-shadow:0 0 16px rgba(255,178,61,.4)}#huddle .fire .wd{color:#6c767a;font-size:13px;letter-spacing:.2em}#huddle .fire.go .wd{color:#1a1204}
#huddle .msn{touch-action:none}#huddle .msn.empty{background:transparent;border-style:dashed}
#huddle .msn.lose{--pc:#ff5a4a;animation:hudPulse 1s infinite}#huddle .msn.win{--pc:#43c06b;animation:hudPulse 1.2s infinite}
@keyframes hudPulse{50%{border-color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc),0 0 10px var(--pc)}}

.hudGhost{position:fixed;left:0;top:0;z-index:20;pointer-events:none;padding:8px 12px;border-radius:10px;background:rgba(12,16,20,.95);border:1px solid #43c06b;color:#43c06b;font:700 13px system-ui,sans-serif}
/* on the map: the corners, one look (.fab). Map top right, Home bottom left (only when away), Build bottom right */
#spdPop{position:absolute;z-index:7;display:flex;gap:4px;padding:4px;background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r);box-shadow:0 2px 8px rgba(0,0,0,.35)}#spdPop[hidden]{display:none}#spdPop button{min-width:52px;min-height:44px}#spdPop button.cur{box-shadow:inset 0 0 0 2px var(--mute);border-color:var(--mute)}
.strip #sStats,.strip #sIdle{padding:0 5px;min-width:44px;gap:9px}.strip #sStats span,.strip #tkBell>*,.strip #sAgeT,.strip #scoreN,.strip #scoreR{display:inline-flex;align-items:center;height:26px;gap:3px}.strip .gl{position:static;transform:none;width:15px;height:15px;display:block;margin:0;flex:none}   /* one line: icon and number share a centre */
#tally button.cell{isolation:isolate}#tally button.cell.sel::after{content:'';position:absolute;inset:5px;z-index:-1;border-radius:7px;background:#2f3b36;border:1px solid var(--mute)}   /* the on mark: a small tile inside the cell; ::before is the divider */
#pauseB .spd{position:absolute;right:4px;bottom:3px;font-size:12px;font-weight:700;color:var(--gold)}
button.fab{all:unset;box-sizing:border-box;position:absolute;z-index:3;width:44px;height:44px;bottom:calc(var(--ob) + 8px);background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r);box-shadow:0 2px 8px rgba(0,0,0,.35);color:var(--bone);cursor:pointer;touch-action:manipulation}.fab svg{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}#homeB{left:var(--pad)}#hudB{right:var(--pad)}#hudB.sel{border-color:#ffb23d;color:#ffb23d}#stage.busy #hudB{display:none}
#stage.busy #homeB{display:none}
#stage.picking #homeB{display:none}
#card .lbl{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.1;min-height:44px}#card .lbl b{font-size:16px}#card .lbl small{color:var(--mute);font-size:13px}
/* the army dock (Build 40 reviews): once Battalions is researched, the battalions sit above the job bar, one tap each; the chevron folds it to a tab */

#dock #dockMin{min-height:44px;min-width:44px;padding:0;background:rgba(18,23,21,.94)}#dock #dockMin::before{content:'⌄';font-size:19px;line-height:1}

#pickbar{position:absolute;left:8px;right:8px;bottom:calc(var(--ob) + 8px);display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(18,23,21,.94);border:1px solid #5ad27a;border-radius:8px;padding:4px 4px 4px 10px;font-weight:700;z-index:3}
#pickbar{flex-direction:column;align-items:stretch;gap:4px;padding:4px}#pickbar .pbTop,#pickbar .pbRow{display:flex;gap:4px;align-items:center}#pickbar .pbRow:empty{display:none}#pickbar span{flex:1;min-width:0;line-height:1.25;padding-left:6px}#pickbar button{min-height:44px;min-width:44px;padding:0 10px}#pickbar .pbRow button{flex:1;padding:0 4px}#pickbar .gl{position:static;transform:none;width:18px;height:18px;display:block}#pickbar button.on{border-color:var(--gold);color:var(--gold)}
#stage.picking #dock{bottom:calc(var(--ob) + 112px)}
/* a building's line: one slot per order it can hold; a filled slot shows what is in it and how far along; tap one to cancel it */
#card .slots{display:grid;grid-template-columns:repeat(var(--qn,5),minmax(0,1fr));gap:4px}
