<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>First Keep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--FONTS-->
<style>
/* One screen, a war table at night: the map fills it, and the tally and the orders float on top as woad-indigo pills with a gold hairline. */
:root{
  --ink:#160f09; --panel:#2a1d13; --panel2:#33241a; --line:#6b5230; --bone:#ece5d3; --mute:#c9bca2; --dim:#a89d86;   /* Build 64: one material, the cards' wood and cream, for the bars, the row and the cards alike (Albert) */
  --blue:#4f93e6; --red:#de5a44; --gold:#e6b947;
  --hb:calc(max(8px,env(safe-area-inset-top,0px)) + 78px); --ob:140px; --pad:8px;
  --row:44px; --strip:28px; --t2:12px; --r:8px; --hair:var(--line); --sheet:rgba(42,29,19,.95);
  --display:"IM Fell English SC", Georgia, "Times New Roman", serif;
  --ui:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--ui);font-size:15px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;position:relative;max-width:560px;margin:0 auto}
/* One mold for every control: .cell. A pill is a row of cells touching; a tile is one cell in its own box. Icon on the top line, word on the second, the same two spots everywhere. */
#hud{position:absolute;top:max(8px,env(safe-area-inset-top,0px));left:0;right:0;box-sizing:border-box;padding:0 var(--pad);display:flex;flex-direction:column;gap:4px;pointer-events:none}#hud>*{pointer-events:auto}
.pill{display:flex;box-sizing:border-box;height:calc(var(--row) + 2px);border:1px solid var(--hair);border-radius:var(--r);background:var(--sheet);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.cell{position:relative;flex:1 1 0;min-width:0;height:var(--row);box-sizing:border-box;color:var(--bone)}
button.cell{all:unset;box-sizing:border-box;position:relative;flex:1 1 0;min-width:0;height:var(--row);color:var(--bone);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button.cell:focus-visible,.strip button:focus-visible,button.fab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.pill .cell+.cell::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--hair)}
.gl{position:absolute;left:50%;top:13px;width:20px;height:20px;transform:translate(-50%,-50%);display:block}
.wd{position:absolute;left:0;right:0;top:33px;transform:translateY(-50%);text-align:center;font-size:var(--t2);font-weight:700;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
#card td.low{color:var(--red)}
.cell.one .gl,.cell.one .wd{top:50%}.cell.one .gl{width:18px;height:18px}
.pill .cell.on{background:#3a2a1c}
#muteB .x,#muteB.off .w{display:none}#muteB.off .x{display:inline}#muteB.off{color:var(--mute)}
#card .lvl{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}#card .lvl small{color:var(--mute)}



#hud{z-index:4}
/* The status pill (Build 64): the state of the world in the tally's mold, one cell under each store column, so the eye reads down a column. */
#status{height:var(--strip);overflow:visible;align-items:flex-start}#status .cell{height:44px;display:flex;align-items:flex-start;justify-content:center;gap:2px;padding:0 1px;overflow:hidden;min-width:0}#status .cell .gl,#status .cell .wd{position:static;transform:none;width:auto;height:26px;line-height:26px;font-size:12px;white-space:nowrap}#status .cell span.gl{display:inline-flex;align-items:center}#status .cell .gl svg{position:static;transform:none;width:13px;height:13px}#status .cell .gl:empty{display:none}#status.pill .cell+.cell::before{top:6px;bottom:auto;height:14px}   /* thin to look at (28 px), 44 px to tap: the buttons hang below it, as the strip did */
#status .cell.dim{color:var(--mute)}#status .cell.dim .wd{color:var(--mute)}#status .cell.lit-r .wd{color:var(--ring-r)}#status .cell.lit-b .wd{color:var(--ring-b)}#status .cell.lit-b{animation:glowb var(--t-long) ease-in-out infinite}@keyframes glowb{0%,100%{text-shadow:0 0 3px rgba(79,157,255,.35)}50%{text-shadow:0 0 12px rgba(79,157,255,1)}}
/* The preview (Build 64): a message arrives the way a phone shows a text, over the map, and fades; nothing under it moves. The bar on its
   left is the colour code: red wrong, green done, blue act on it, white news. */
#pv{position:absolute;z-index:5;top:calc(var(--hb) + 6px);left:var(--pad);right:var(--pad);display:flex;align-items:stretch;min-height:44px;box-sizing:border-box;border:1px solid var(--hair);border-left:5px solid var(--cc,var(--ring-w));border-radius:var(--r);background:var(--sheet);box-shadow:0 4px 14px rgba(0,0,0,.45);color:var(--bone);transition:opacity var(--t-sweep)}
#pv.fade{opacity:0}#pv button{all:unset;box-sizing:border-box;min-height:44px;cursor:pointer;touch-action:manipulation}
#pv .t{flex:1;min-width:0;padding:4px 10px;display:flex;flex-direction:column;justify-content:center;font-size:15px;font-weight:600;line-height:1.2}
#pv .t small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}#pv .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pv .x{width:44px;display:flex;align-items:center;justify-content:center;color:var(--mute)}#pv .x .gl{position:static;transform:none}
#pv .ask{display:flex;gap:4px;padding:4px}#pv .ask button{padding:0 12px;border:1px solid var(--hair);border-radius:6px;display:flex;align-items:center;font-weight:700}
#pv .ask button.yes{background:#3a2a1c}
.hi{width:16px;height:16px}
#stage{position:absolute;inset:0;overflow:hidden;background:#20301c;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse farthest-corner at 50% 50%,rgba(0,0,0,0) 42%,rgba(0,0,0,.3) 100%)}
#mini{position:absolute;top:calc(var(--hb) + 8px);right:8px;width:86px;height:86px;border:1px solid rgba(236,229,211,.5);border-radius:4px;background:#000}
#card.full{max-height:calc(100% - var(--ob) - var(--hb) - 14px)}
#place{position:absolute;left:8px;right:8px;bottom:calc(var(--ob) + 8px);display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(36,25,16,.95);border:1px solid var(--gold);border-radius:8px;padding:6px 6px 6px 10px;font-weight:700}
#strip{position:absolute;display:flex;gap:4px;padding:4px;background:rgba(36,25,16,.95);border:1px solid var(--gold);border-radius:10px;z-index:5;max-width:calc(100% - 8px);overflow-x:auto}
#strip[hidden]{display:none}#strip{flex-wrap:wrap}#strip .sn{flex:0 0 100%;width:0;min-width:100%;font-size:12px;color:var(--mute);text-align:center;padding:0 4px 2px;white-space:normal;line-height:1.2}#strip button{min-height:44px;min-width:44px;padding:2px 8px;flex:0 0 auto}#strip button.ic{width:44px;padding:0;font-size:19px;font-weight:700}#strip button.people{background:linear-gradient(#2b4a33,#1c3222);border-color:#4f7a56}#strip button.build{background:linear-gradient(#56391f,#3a2716);border-color:#8c6a3d}#strip.panel{flex-direction:column;width:250px;align-items:stretch}#strip.panel button{width:auto;text-align:left}#strip.panel button.ic{align-self:flex-end;width:44px}#strip .dial{flex:0 0 100%;display:grid;grid-template-columns:1fr 44px 36px 44px;align-items:center;gap:4px;color:var(--bone);font-size:14px}#strip .dial span{text-align:center;font-weight:700}#strip .dial button{min-width:44px;padding:0}#strip .gl{position:static;transform:none;width:18px;height:18px;display:block}#strip{gap:4px;padding:4px}#strip button b{font-size:12px}#strip button small{font-size:12px}
#place span{flex:1;min-width:0;line-height:1.25}
#place button{min-height:44px;padding:0 12px}
#card{box-sizing:border-box;position:absolute;left:6px;right:6px;bottom:calc(var(--ob) + 6px);max-height:min(62%,calc(100% - var(--ob) - var(--hb) - 14px));overflow-y:auto;background:rgba(42,29,19,.97);border:1px solid var(--line);border-radius:10px;padding:6px 8px 8px;display:flex;flex-direction:column;gap:4px;box-shadow:0 -6px 24px rgba(0,0,0,.45)}
#card h3{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.05em;color:var(--lamp);display:flex;align-items:center;gap:8px;line-height:1.1;min-height:44px;padding:0 96px 0 2px;margin:-6px 0 4px;border-bottom:1px solid var(--brass);position:sticky;top:-6px;z-index:2;background:linear-gradient(170deg,#3a2a1c,#34261a)}   /* the title stays at the top while the card scrolls, the book and the close over it (Build 60) */   /* as tall as the book and the close, so neither hangs over the first row */
#card .who{font-family:var(--ui);font-size:13px;color:var(--mute);font-weight:700}
#card p{margin:0;color:var(--mute);line-height:1.35;font-size:16px}
#card p i{color:var(--bone);font-style:normal;font-weight:700}
#card .fold{border-top:1px solid #2a332e;padding-top:2px}
#card .fold summary{color:var(--mute);font-size:13px;min-height:44px;display:flex;align-items:center;cursor:pointer;list-style:none}
#card .fold summary::-webkit-details-marker{display:none}
#card .fold summary::before{content:'+';display:inline-block;width:18px;font-weight:700}
#card .fold[open] summary::before{content:'−'}
#card .fold p{margin-top:4px}
#card .hp{height:5px;background:#0b0e0c;border-radius:3px;overflow:hidden}
#card .hp i{display:block;height:100%}
#card .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}#card .stats div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 4px;text-align:center;font-size:13px;line-height:1.15;min-height:44px}#card .stats small{display:block;color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin-bottom:2px}
#card .acts.menu .bk{position:relative}#card .acts.menu .bk>button:first-child{width:100%;min-height:92px;padding-top:6px;align-items:center}#card .acts.menu .bk img{display:block;width:40px;height:40px;margin:0 auto 2px}#card .acts.menu .bk button.pin:not(#cardX):not(#cardI){position:absolute;right:-4px;top:-4px;min-width:44px;min-height:44px;width:44px;height:44px;padding:0;border:0;background:none;box-shadow:none;color:var(--dim);display:grid;place-items:center}#card .acts.menu .bk button.pin svg{width:16px;height:16px}#card .acts.menu .bk button.pin.on:not(#cardX):not(#cardI){color:var(--lamp)}#card .acts.menu .bk.pinned>button:first-child{border-color:var(--lamp)}
#card .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;min-height:44px}#card .acts:empty{display:none}
#card.sm{max-height:min(46%,calc(100% - var(--ob) - var(--hb) - 14px))}
/* a row of six in a card: the same element as the bar below the map (Build 63) */
#card .tiles{margin:2px 0}#card .tiles .tr{gap:4px}#card .tiles button.cell{background:var(--panel2);border:1px solid var(--line);box-shadow:none}#card .tiles button.cell.sel{border-color:var(--lamp)}#card .tiles .wd{color:var(--mute)}#card .tiles button.cell.dis{opacity:.45}
#card .acts.c1{grid-template-columns:1fr}
#card .acts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
#card .acts.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
#card .sec{font-size:13px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
#card .g{border-top:1px solid var(--line);padding-top:5px;display:flex;flex-direction:column;gap:3px}
#card .g b{font-size:16px;font-weight:700}
#card .g small{color:var(--dim);font-size:13px;white-space:normal}
#card table{color:var(--bone);border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;width:100%}
#card td,#card th{padding:3px 4px;text-align:right;border-bottom:1px solid var(--line)}
#card td:first-child,#card th:first-child{text-align:left}
#card th{color:var(--mute);font-weight:700}
#card .done{color:#9fd8b5}
#card .chips{display:flex;flex-wrap:wrap;gap:5px}
#card .chip{border:1px solid #4fb06a;box-shadow:inset 0 0 0 1px #4fb06a;color:#dcf5e8;border-radius:12px;padding:3px 9px;font-size:13px;font-weight:700}
#card .dim{color:var(--mute)}
#card .copy{text-align:center;font-size:13px;margin:2px 0 0}
#cardBar{position:sticky;top:6px;height:0;margin-bottom:-4px;z-index:3;flex:none}
#cardI{position:absolute;top:-12px;right:40px;min-height:44px;min-width:44px;padding:0;background:none;border:0;display:grid;place-items:center}   /* the book centred on the × line, as the × is */
#cardX{position:absolute;top:-12px;right:-4px;min-height:44px;min-width:44px;padding:0;background:none;border:0;display:grid;place-items:center}#cardX svg,#cardI svg{display:block;margin:auto;position:static;transform:none}#cardX svg{width:26px;height:26px}   /* the book and the × both centred on the title line */#cardI svg{width:24px;height:24px}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(26,18,10,.88);text-align:center;padding:0 16px}
#end h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0}
#end p{margin:0;color:var(--mute);font-size:15px}
#card p.why{font-size:12px;line-height:1.25;margin:0}
#endX .crowns{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:8px 0}
#endX .crowns p{font-size:15px}#endX .crowns b{color:var(--bone)}
#endX details{text-align:left}#endX summary{color:var(--mute);font-size:13px;min-height:44px;display:flex;align-items:center;cursor:pointer;list-style:none}#endX summary::-webkit-details-marker{display:none}#endX summary::before{content:'+';display:inline-block;width:18px;font-weight:700}#endX details[open] summary::before{content:'−'}
#endX details p{font-size:12px;margin:2px 0}#endX details small{font-size:12px;color:var(--mute);margin-right:6px}
#card .qs{display:grid;grid-template-columns:1fr 44px 76px 44px;gap:4px;align-items:center;margin:2px 0}
#card .qs span{text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
#card .qs button{padding:0;font-size:20px;font-weight:700;min-height:44px}#card .qs.trade{grid-template-columns:1fr 104px 92px;margin:-1px 0;gap:2px}#card .qs.trade b{font-size:15px}#card .qs.trade b small{font-size:12px;color:var(--mute);font-weight:500}#card .qs.trade button:not(#cardX):not(#cardI){font-size:14px;min-height:44px;height:44px;padding:0 2px}#card .qs.trade button b{font-size:14px}
#endActs{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}#endActs button small{white-space:normal}
#orders{position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:0 var(--pad) max(8px,env(safe-area-inset-bottom,0px));pointer-events:none}
#orders .tiles{pointer-events:auto}
button.ghost{visibility:hidden}
.tr{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px}.tr>[hidden],.pill>[hidden]{display:none}

.col{display:flex;flex-direction:column;gap:3px;min-width:0}.col>button.cell{flex:none}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.tiles button.cell{background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tiles button.cell.sel{background:#3a2a1c;border-color:var(--mute)}
.tiles button.cell.dis{color:var(--dim)}
.tiles .st{font-size:19px;font-weight:700;line-height:calc(var(--row) - 2px);text-align:center}
.tiles .top{position:absolute;left:0;right:0;top:13px;transform:translateY(-50%);display:flex;justify-content:center;align-items:center;gap:4px}
.tiles .top .gl{position:static;transform:none;width:16px;height:16px}
.tiles .top .c{font-size:15px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tiles .wd{color:var(--mute)}.tiles .sel .wd{color:var(--bone)}
#tPeople .gl{width:22px;height:22px}
#tPeople .wd{color:var(--bone)}
/* three tints the thumb learns (Build 61, Albert): people green, build timber-brown, jobs black */
.tiles button.cell#buildT{background:linear-gradient(#56391f,#3a2716);border-color:#8c6a3d}.tiles button.cell#buildT.sel{background:linear-gradient(#7a5a2e,#4e3618);border-color:#c9a46a}
/* the attack cards: the same dark glass, hairlines and one amber accent as the huddle bar */
#jobs[hidden],#huddle[hidden]{display:none}
/* the one row, three shapes (Build 63): join = two touching; whole = one tall button; the plain col is a tile over − and + */
.col.join{gap:0}.col.join>button.cell:first-child{border-radius:var(--r) var(--r) 0 0}.col.join>button.cell:last-child{border-radius:0 0 var(--r) var(--r);border-top:0}
#huddle .col.whole>button.cell.tall{height:calc(var(--row) * 2 + 3px)}#huddle .col.whole .top.thumb{top:30px}#huddle .col.whole .top.thumb img{width:40px;height:40px;display:block}#huddle .col.whole .wd{top:74px;font-size:10px;letter-spacing:.02em;white-space:normal;overflow-wrap:anywhere;line-height:1;padding:0 2px}#huddle .col.whole .top:not(.thumb){top:34px}#huddle .col.whole .top:not(.thumb) .gl{width:22px;height:22px}
.tiles button.cell.no{background:#3a2a1c;border-color:#6b5230;color:var(--bone)}
.tiles button.cell.build,.tiles button.cell.st.build{background:linear-gradient(#56391f,#3a2716);border-color:#8c6a3d}.tiles button.cell.build.dis{opacity:.5}
.tiles button.cell.train.sel{border-color:#c9a46a}
#orders:not(.pg-jobs){background:rgba(26,18,10,.84);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(201,164,106,.35)}   /* every page but Jobs on one brown backing, however you got there (Build 65) */
/* the huddle: dark flat glass, hairlines, one amber accent; only while planning an attack. A lamp line on top of a button: red not set, green set */

#huddle button.cell{position:relative;overflow:hidden;background:#2a1d13;border:1px solid rgba(201,164,106,.35);border-radius:10px;box-shadow:none;color:#ece5d3}
#huddle .wd{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}#huddle .wd.mid{top:50%}
#huddle .top .c{font-size:20px}
#huddle .st.w{font-size:12px;letter-spacing:.08em;text-transform:uppercase;line-height:calc(var(--row) - 2px)}
#huddle .bar::after,#huddle .msn:not(.empty):first-child::after{content:'';position:absolute;left:10px;right:10px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--mc,#e0503f)}



#huddle .cell.sel{border-color:#ffb23d}
#huddle button.cell.sq.sel{background:linear-gradient(#54402a,#3a2a1c);border-color:#c9a46a}#huddle button.cell.go .wd,#huddle button.cell.go .gl{color:#9cc8ff}
#huddle .msn{touch-action:none}#huddle .msn.empty{background:transparent;border-style:dashed}
#huddle .msn.lose{--pc:var(--ring-r);animation:hudPulse var(--t-settle) infinite}#huddle .msn.win{--pc:var(--ring-g);animation:hudPulse var(--t-settle) infinite}   /* losing and winning pulse alike; the colour says which */
@keyframes hudPulse{50%{border-color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc),0 0 10px var(--pc)}}
@media (prefers-reduced-motion:reduce){#huddle .msn.lose,#huddle .msn.win{animation:none;border-color:var(--pc)}#huddle .blink{animation:none}}

/* on the map: the corners, one look (.fab). Map top right, Home bottom left (only when away), Build bottom right */
#spdPop{position:absolute;z-index:7;display:flex;gap:4px;padding:4px;background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r);box-shadow:0 2px 8px rgba(0,0,0,.35)}#spdPop[hidden]{display:none}#spdPop button{min-width:52px;min-height:44px}#spdPop button.cur{box-shadow:inset 0 0 0 2px var(--mute);border-color:var(--mute)}
