<meta charset="utf-8">
<title>First Keep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* One screen, a war table at night: the tally, the map, three rows of orders. One dark look by choice. */
:root{
  --ink:#121715; --panel:#1b221f; --panel2:#232c28; --line:#34413b; --bone:#ece5d3; --mute:#a7b1aa; --dim:#909a93;
  --blue:#4f93e6; --red:#de5a44; --gold:#e6b947;
  --display:"IM Fell English SC", Georgia, "Times New Roman", serif;
  --ui:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--ui);font-size:15px;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:6px;padding-block:8px;box-sizing:border-box;max-width:560px;margin:0 auto}
#hud{display:flex;align-items:center;gap:5px}
.tally{display:flex;gap:6px;flex:1;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;min-width:0}
.tally span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.hb{min-height:44px;min-width:44px;padding:0 4px;flex-direction:row}
#score{min-width:50px;gap:0;flex-direction:column;line-height:1;font-variant-numeric:tabular-nums}
#score b{font-size:14px}#score small{font-size:12px}
#stage{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#20301c;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse farthest-corner at 50% 50%,rgba(0,0,0,0) 42%,rgba(0,0,0,.3) 100%)}
#mini{position:absolute;top:8px;right:8px;width:86px;height:86px;border:1px solid rgba(236,229,211,.5);border-radius:4px;background:#000}
#banner{position:absolute;left:8px;right:60px;top:8px;font-weight:600;font-size:15px;pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
#banner span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;background:rgba(18,23,21,.88);padding:5px 9px;border-radius:6px;max-width:100%}
#banner .warn{color:#ffe1da;background:rgba(124,32,22,.92)}
#banner .good{color:#dcf5e8;background:rgba(28,84,58,.92)}
#banner span[data-act]{pointer-events:auto;cursor:pointer}
#banner span[data-act]::after{content:" · show me";color:#ffd0c4;font-weight:700}
#banner span.help::after{content:" · send help"}
#place{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(18,23,21,.94);border:1px solid var(--gold);border-radius:8px;padding:6px 6px 6px 10px;font-weight:600}
#place span{flex:1;min-width:0;line-height:1.25}
#place button{min-height:44px;padding:0 12px}
#card{position:absolute;left:6px;right:6px;bottom:6px;max-height:calc(100% - 12px);overflow-y:auto;background:rgba(24,30,27,.97);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 -6px 24px rgba(0,0,0,.45)}
#card h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;display:flex;align-items:center;gap:8px;padding-right:40px}
#card .who{font-family:var(--ui);font-size:14px;color:var(--mute);font-weight:600}
#card p{margin:0;color:var(--mute);line-height:1.35;font-size:15px}
#card p i{color:var(--bone);font-style:normal;font-weight:600}
#card p.soon{opacity:.75}
#card .fold{border-top:1px solid #2a332e;padding-top:2px}
#card .fold summary{color:var(--mute);font-size:14px;min-height:44px;display:flex;align-items:center;cursor:pointer;list-style:none}
#card .fold summary::-webkit-details-marker{display:none}
#card .fold summary::before{content:'+';display:inline-block;width:18px;font-weight:700}
#card .fold[open] summary::before{content:'−'}
#card .fold p{margin-top:4px}
#card .hp{height:5px;background:#0b0e0c;border-radius:3px;overflow:hidden}
#card .hp i{display:block;height:100%}
#card .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
#card .acts.c1{grid-template-columns:1fr}
#card .acts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
#card .acts.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
#card .sec{font-size:14px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
#card .g{border-top:1px solid var(--line);padding-top:7px;display:flex;flex-direction:column;gap:3px}
#card .g b{font-size:17px;font-weight:700}
#card .g small{color:var(--dim);font-size:13px;white-space:normal}
#card table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;width:100%}
#card td,#card th{padding:3px 4px;text-align:right;border-bottom:1px solid var(--line)}
#card td:first-child,#card th:first-child{text-align:left}
#card th{color:var(--mute);font-weight:600}
#card .done{color:#9fd8b5}
#card .chips{display:flex;flex-wrap:wrap;gap:5px}
#card .chip{border:1px solid #4fb06a;box-shadow:inset 0 0 0 1px #4fb06a;color:#dcf5e8;border-radius:12px;padding:3px 9px;font-size:13px;font-weight:600}
#card .dim{color:var(--mute)}
#cardX{position:absolute;top:4px;right:4px;min-height:44px;min-width:44px;padding:0;font-size:18px}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(18,23,21,.86);text-align:center;padding:0 16px}
#end h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0}
#end p{margin:0;color:var(--mute);font-size:16px}
#endActs button small{white-space:normal}
#card .qs{display:grid;grid-template-columns:1fr 44px 76px 44px;gap:6px;align-items:center;margin:4px 0}
#card .qs span{text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
#card .qs button{padding:0;font-size:19px;font-weight:700;min-height:44px}
#endActs{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}
#orders{display:flex;flex-direction:column;gap:6px}
.row{display:grid;gap:6px}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
.r5{grid-template-columns:repeat(5,minmax(0,1fr))}.r6{grid-template-columns:repeat(6,minmax(0,1fr))}
.ico{width:14px;height:14px;display:inline-block;flex:0 0 auto}
#tip{position:absolute;left:8px;right:8px;bottom:60px;display:flex;align-items:center;gap:8px;background:rgba(16,28,44,.93);border:1px solid var(--blue);border-radius:8px;padding:6px 6px 6px 10px;font-weight:600;font-size:14px;line-height:1.3}
#tip span{flex:1;min-width:0}
button{font:inherit;color:var(--bone);background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:46px;padding:4px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button b{font-weight:700;font-size:15px;white-space:nowrap}
button small{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
#card button small{white-space:normal;text-align:center;line-height:1.15}
button.dis{color:var(--dim)}
button.dis small{color:var(--dim)}
button.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
button.go{border-color:var(--blue);color:#dbe9ff}
button.warn{border-color:var(--red)}
button.ok{border-color:#4fb06a;box-shadow:inset 0 0 0 1px #4fb06a;color:#dcf5e8}
button.ok small{color:#8fd4a4}
.jobc{display:flex;flex-direction:column;gap:3px;min-width:0}
.jobc .jn{min-height:32px;flex-direction:row;justify-content:space-between;padding:2px 5px;gap:3px}
.jobc .jn b{font-size:14px}
.jobc .pm{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.jobc .pm button{min-height:34px;padding:0;font-size:19px;font-weight:700;background:var(--panel2)}
#menus button{min-height:44px}
#menus button b{font-size:14px}
#zoom{position:absolute;right:8px;top:102px;display:flex;flex-direction:column;gap:6px}
#corner{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:6px}
#corner button{min-height:44px;min-width:44px;width:44px;padding:0;background:rgba(27,34,31,.92)}
#cInfo{background:rgba(18,23,21,.82);border-radius:8px;padding:6px 9px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
#zoom button{min-height:44px;min-width:44px;width:44px;padding:0;font-size:20px;font-weight:700;background:rgba(27,34,31,.92)}
@media (max-width:440px){.tally{gap:1px;font-size:12px}.tally span{gap:1px}.tally .ico{width:12px;height:12px}}
@media (max-width:400px){.tally{font-size:12px;gap:1px}.tally span{gap:0}.tally .ico{width:11px;height:11px}.hb{padding:0 1px}#hud{gap:1px}#score{min-width:44px;padding:0}#score b{font-size:12px}body{padding-left:8px;padding-right:8px}}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>

<div id="app">
  <header id="hud">
    <div class="tally">
      <span title="Food"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.5 L10.5 1.5" stroke="#6aa04f" stroke-width="1.6" stroke-linecap="round"/><circle cx="5.2" cy="10" r="3.3" fill="#d9607a"/><circle cx="10.8" cy="10" r="3.3" fill="#d9607a"/><circle cx="8" cy="6.4" r="3.3" fill="#ec8ea3"/></svg><span id="rf">0</span></span>
      <span title="Wood"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="5" width="13" height="7" rx="3.5" fill="#a8743f"/><circle cx="11.6" cy="8.5" r="2.7" fill="#e3b98a"/><circle cx="11.6" cy="8.5" r="1.1" fill="#a8743f"/></svg><span id="rw">0</span></span>
      <span title="Stone"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 12.5 L3.5 5 L8.5 2.5 L14.5 6.5 L13.5 13.5 Z" fill="#b4bbc0" stroke="#6b7378"/><path d="M3.5 5 L8.5 7 L14.5 6.5 M8.5 7 L8 13.5" stroke="#868e93" fill="none"/></svg><span id="rs">0</span></span>
      <span title="Gold"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="#f2cf55"/><circle cx="8" cy="8" r="4" fill="none" stroke="#b8902a" stroke-width="1.3"/></svg><span id="rg">0</span></span>
      <span title="Iron"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 11 L5 5 L11 5 L14 11 Z" fill="#8fa3b5"/><path d="M5 5 L11 5 L9.5 8 L6.5 8 Z" fill="#c9d4de"/></svg><span id="ri">0</span></span>
    </div>
    <button class="hb" id="score" data-act="card:score" aria-label="Score"><b id="scoreN">0</b></button>
    <button class="hb" id="speed" data-act="speed" aria-label="Pause, play, speed">×1</button>
    <button class="hb" id="helpB" data-act="help" aria-label="How to play">?</button>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="vig"></div>
    <canvas id="mini" width="172" height="172"></canvas>
    <div id="zoom"><button data-act="selmode" id="selB" aria-label="Select with a box">⬚</button></div>
    <div id="corner"><button data-act="home" aria-label="Back to your Town Center"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 10 L10 3.5 L17 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M5.5 9 V16.5 H14.5 V9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8.6 16.5 V12.2 H11.4 V16.5" fill="currentColor"/></svg></button><span id="cInfo"></span></div>
    <div id="banner"></div>
    <div id="place" hidden><span id="placeT">Press where it goes</span><button data-act="placeok" id="placeOk" class="go"><b>Build</b></button><button data-act="cancel"><b>Cancel</b></button></div>
    <div id="tip" hidden><span id="tipT"></span><button data-act="tipx" aria-label="Dismiss tip" style="min-height:44px;min-width:44px;padding:0">×</button></div>
    <div id="card" hidden></div>
    <div id="end" hidden>
      <h2 id="endT">Victory</h2>
      <p id="endP"></p>
      <div class="acts c1" id="endActs"><button data-act="next" id="endNext" class="go"><b>Add another conquest</b><small>new map · keeps your age and research</small></button><button data-act="free" id="endFree"><b>Continue as free play</b><small>no clock, no victory</small></button><button data-act="again"><b>New game</b></button></div>
    </div>
  </div>

  <section id="orders">
    <div class="row r6" id="jobs"></div>
    <div class="row r5" id="menus"></div>
    <div class="row r4">
      <button data-act="train:vil" id="bVil"><b>Villagers</b><small>50f</small></button>
      <button data-act="card:army" id="bArmy"><b>Army</b><small>0</small></button>
      <button data-act="card:keep" id="bAge"><b>Town</b><small>age</small></button>
      <button data-act="card:fortress" id="bDip"><b>Fortress</b><small>neutral</small></button>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';
// ═════ 01-rules.js ═════
// ───────────────────────── The rules: every number lives in a table ─────────────────────────
const BUILD = 30;
const MAP = 2000, MID = MAP / 2, DT = 1 / 30;
const POPMAX = 150, VILMAX = 60, ARMYMAX = 90, BNSIZE = 30, BNS = 6;   // six battalions, once Command is researched at a War Council; BNSIZE: the most one Zeal blesses
const RICH = 2.5, PLUNDER = 0.25, CARRY = 10, NAVC = 10;                // NAVC: the walking grid, 10 units a square (never shown)
const LAKE0 = { x: MID, y: MID, r: 170 };                              // the great lake in the middle; each corner also gets a lake of its own (G.lakes)
const SEASON_LEN = 180, DAY_LEN = 120, NIGHT_SIGHT = 0.6;
const ZOOM_MAX = 4, ZOOM_STEP = 1.3, TILT = 0.66, SIDE = 0.4;   // SIDE: how far right the back of a building sits, per unit of depth, so its east wall shows
const WILD = 4;                                                          // the fifth side: animals, bandits, robbers, monsters

// One table for the four resources: short key, colour, name, where it is dropped off.
const RESOURCES = {
  food:  { k: 'f', name: 'Food',  col: '#e0708a', drop: 'Mill' },
  wood:  { k: 'w', name: 'Wood',  col: '#c08a58', drop: 'Lumber camp' },
  stone: { k: 's', name: 'Stone', col: '#b4bbc0', drop: 'Mine' },
  gold:  { k: 'g', name: 'Gold',  col: '#f2cf55', drop: 'Mine' },
  iron:  { k: 'i', name: 'Iron',  col: '#8fa3b5', drop: 'Mine' },   // the metal of the Iron age: weapons and armour from the Classical age on
};
const RES = Object.keys(RESOURCES), KEY = Object.fromEntries(RES.map(r => [r, RESOURCES[r].k])), LONG = Object.fromEntries(RES.map(r => [RESOURCES[r].k, r]));
const JOBS = ['food', 'farm', 'wood', 'stone', 'gold', 'iron'];

const PLAYERS = [
  { name: 'You',      pers: 'human', color: '#4f93e6', keep: [300, 1700] },
  { name: 'Raiders',  pers: 'aggr',  color: '#de5a44', keep: [300, 300] },
  { name: 'Rivals',   pers: 'bal',   color: '#b07ae6', keep: [1700, 300] },
  { name: 'Fortress', pers: 'fort',  color: '#5fb08a', keep: [1700, 1700] },
  { name: 'The wild', pers: 'wild',  color: '#9b8b72', keep: [MID, MID] },
];
const FORT = 3;   // the neutral side that can be won as an ally

const AGES = [
  { name: 'Settlement' },
  { name: 'Bronze',    cost: { f: 300, w: 100 },         t: 40 },
  { name: 'Classical', cost: { f: 600, g: 200 },         t: 60 },
  { name: 'Medieval',  cost: { f: 1000, g: 500, s: 200 }, t: 80 },
  { name: 'Gunpowder', cost: { f: 1600, g: 900, s: 300, i: 400 }, t: 100 },
];
const SEASONS = [   // one year is 12 minutes; real effects, simplified
  { name: 'Spring', spd: 0.85, farm: 1.0,  note: 'mud slows marching',                 tint: null },
  { name: 'Summer', spd: 1.0,  farm: 1.1,  note: 'good marching weather',              tint: null },
  { name: 'Autumn', spd: 1.0,  farm: 1.25, note: 'harvest',                            tint: 'rgba(190,120,40,.12)' },
  { name: 'Winter', spd: 0.8,  farm: 0.4,  note: 'cold slows armies; farms barely grow', tint: 'rgba(225,232,240,.30)' },
];

// Units. cls: which limit it counts toward (civ = the 60 villagers and workers, army = the 90). tick: which routine runs it.
// tags say what it is; vs says what it beats (×, by tag or kind; the best match counts). bld: × against buildings.
// rarmor: × it takes from arrows and bolts. tiers come from research (TECH.tier).
const UNIT = {
  vil:      { name: 'Villager',  cls: 'civ', tick: 'vil', tags: ['civ'], hp: 25, spd: 24, sight: 90, dmg: 3, rng: 30, cd: 1.5, cost: { f: 50 }, t: 8, at: 'keep', also: ['town'], age: 0, look: 'vil', desc: 'Gathers food, wood, stone and gold and carries it to the nearest drop-off. Hunts deer and boar with a javelin.' },
  scout:    { name: 'Scout',     cls: 'civ', tick: 'scout', tags: ['civ', 'mounted'], hp: 45, spd: 36, sight: 220, dmg: 3, rng: 12, cd: 1.5, cost: { f: 80 }, t: 12, at: 'keep', age: 0, look: 'scout', desc: 'A fast rider. Tours the map and picks up any treasure nobody guards. Tap the map to send it.' },
  envoy:    { name: 'Emissary',  cls: null,  tick: 'envoy', tags: ['civ'], hp: 20, spd: 36, sight: 100, cost: { g: 40 }, t: 0, age: 1, look: 'envoy', desc: 'Carries your offer to the Fortress. Killing one is an act of war.' },
  caravan:  { name: 'Caravan',   cls: 'civ', tick: 'caravan', tags: ['civ'], hp: 40, spd: 16, sight: 100, cost: { w: 80, f: 40 }, t: 14, at: 'market', age: 1, look: 'caravan', desc: 'An ox cart: about two thirds of walking pace. With no route it runs between your Markets for gold, the farther the more. Give it a route on its card and it carries goods from your Business Center to a Market or a trade stop. Robbers come for it near their camps.' },
  spy:      { name: 'Spy',       cls: 'army', tick: 'spy', tags: ['civ'], hp: 20, spd: 24, sight: 120, cost: { f: 30, g: 60 }, t: 12, at: 'courthouse', age: 1, stealth: [45, 140], look: 'spy', desc: 'Hidden: soldiers see it only within 45, towers, the Town Center and Courthouses within 140. Near an enemy building it reads their stores, age, research and army. Sent to sabotage, it is used up.' },
  priest:   { name: 'Priest',    cls: 'army', tick: 'priest', tags: ['civ'], hp: 30, spd: 24, sight: 120, cost: { f: 40, g: 60 }, t: 14, at: 'temple', age: 1, look: 'priest', desc: 'Does not fight. Walks with the army so you can call Zeal, and takes holy sites: stand it at a shrine for 10 s and the shrine pays you gold.' },
  medic:    { name: 'Medic',     cls: 'army', tick: 'medic', tags: ['civ'], hp: 30, spd: 24, sight: 120, heal: 3, hrng: 55, cost: { f: 40, g: 40 }, t: 12, at: 'hospital', age: 2, look: 'medic', desc: 'Walks with the army and binds wounds: soldiers within 55 heal 3 health a second. Town Center it behind the line.' },
  spear:    { name: 'Spearman',  cls: 'army', tick: 'sol', tags: ['infantry', 'spear'], hp: 60, spd: 24, sight: 130, dmg: 6, rng: 12, cd: 1.2, cost: { f: 50, w: 25 }, t: 10, at: 'barracks', age: 0, vs: { mounted: 3 }, look: 'spear', desc: 'Front line. Cheap and tough. Strong against anything on horseback.' },
  sword:    { name: 'Swordsman', cls: 'army', tick: 'sol', tags: ['infantry'], hp: 70, spd: 24, sight: 130, dmg: 8, rng: 12, cd: 1.2, cost: { f: 60, g: 25 }, t: 12, at: 'barracks', age: 1, vs: { infantry: 1.5, siege: 2 }, bld: 1.5, look: 'sword', desc: 'Heavy infantry. Beats other foot soldiers and breaks buildings faster than most.' },
  archer:   { name: 'Archer',    cls: 'army', tick: 'sol', tags: ['infantry', 'archer', 'ranged'], hp: 30, spd: 24, sight: 150, dmg: 5, rng: 95, cd: 1.6, cost: { f: 30, w: 45 }, t: 10, at: 'range', age: 1, vs: { spear: 2, infantry: 1.3 }, bld: 0.4, look: 'archer', desc: 'Back line. Shoots from range; strong against foot soldiers, weak to riders and javelins.' },

// ═════ 02-text.js ═════
// ───────────────────────── Why it is so: the history behind each row ─────────────────────────
// Dates are "about" unless exact; where historians disagree the text says so. Each line credits more than one place where the record allows.
const WHY = {
  age0: 'Farming villages of the Neolithic (from about 10,000 years ago): fields, houses, a wall. Jericho had a stone wall and tower about 8000 BC.',
  age1: 'Bronze (from about 3300 BC in the Near East): the first cities, writing, law, chariots and standing armies, in Sumer, Egypt, the Indus valley and China.',
  age2: 'Classical antiquity (about 500 BC to AD 500): iron weapons, legions and phalanxes, libraries, roads and aqueducts, from Rome and Persia to Maurya India and Han China.',
  age3: 'The Middle Ages (about AD 500 to 1500): castles, knights, crossbows and longbows, universities, and the heavy plough.',
  age4: 'Gunpowder (about AD 1400 to 1600): matchlock guns and cannon. Great bombards broke Constantinople\'s walls in 1453; Italian engineers answered with low angled star forts, and walls stopped being the end of a siege.',
  arquebus: 'The matchlock arquebus (late 15th century) let a few weeks of drill make a soldier. Spanish arquebusiers won at Cerignola in 1503, and pike-and-shot formations ruled the next century.',
  bombard: 'Bombards such as Mons Meg (1449) and the Ottoman guns at Constantinople (1453) fired stone balls of hundreds of pounds: slow, but nothing built before them stood long.',
  musket: 'The heavier musket, fired from a forked rest, outranged and outpunched the arquebus by the mid-16th century.',
  starfort: 'The trace italienne: after Charles VIII\'s guns broke Italian walls in days (1494), engineers built low, thick, angled bastions with crossfire. Sieges went from weeks to years.',
  keep: 'Towns grew around a hall where the lord or council met, the market was held and grain was stored: the town hall, the moot hall, the agora. It is the heart of the place: lose it and the town is lost.',
  town: 'Kingdoms spread by founding new towns with a hall and a market of their own: the Roman colonia, the medieval new town and bastide.',
  venture: 'Merchants met at fixed places to trade on credit at the going price: the Bruges Bourse from about 1400, Antwerp in 1531. Before that, Italian merchants pooled money in ventures, the commenda, sharing the profit or the loss of a voyage.',
  house: 'A settlement is as big as its shelter, food and water. Houses are why villages grew past the camp.',
  apartment: 'Cities grow upward where land is dear. Rome\'s insulae housed most of the city, five or six floors tall; emperors had to cap their height.',
  aqueduct: 'Rome\'s first aqueduct, the Aqua Appia, was begun in 312 BC; Persian qanats and Assyrian channels moved water long before. More water, more people.',
  farm: 'Farming began about 10,000 years ago in several places (the Fertile Crescent, China, New Guinea, Mesoamerica). A field gives steady food where foraging runs out, but not in winter.',
  treefarm: 'Coppicing, cutting trees back so they regrow, is as old as farming: the Sweet Track in Somerset (about 3800 BC) was built of coppiced timber.',
  mill: 'Grain was ground at the quern and later the mill. A drop-off beside the fields saves the walk, and the walk is where the time goes.',
  lumber: 'Timber was fuel and building material for most of history. Cutting at the forest and stacking there beats hauling logs home.',
  mining: 'Stone and ore were dug where they lay. Neolithic flint miners at Grimes Graves (about 2600 BC) dug shafts with antler picks.',
  barracks: 'Neolithic warbands trained together; the first standing armies (Akkad, about 2300 BC; later Egypt, Assyria, Rome, Han China) needed barracks and drill.',
  range: 'Bows are older than farming. A range is where archers practise in numbers, because a volley beats a single shot.',
  stable: 'Horses were tamed about 3500 BC or later (the date is argued). Chariots ruled Bronze-age battlefields (Kadesh, 1274 BC); riders replaced them in the Iron age.',
  smith: 'Bronze (about 3300 BC) and then iron (widespread around 1200 BC) changed who won. The smith made the difference.',
  siege: 'Assyrian reliefs (about 865 BC, now in the British Museum) show rams under roofs and archers in siege towers. Greeks and Romans added torsion catapults.',
  council: 'Generals planned together: in Athens the ten strategoi met at the strategeion, Rome had the praetorium. Drill and formation won battles: the phalanx, the column on the march, the wedge of horse, the Scots schiltron square against knights.',
  market: 'Markets traded surplus for what a region lacked, from Old Assyrian Kanesh (about 1900 BC) to the Greek agora and the Roman forum.',
  courthouse: 'Written law (Hammurabi, about 1754 BC) and the officers who kept it. Spy-catching is our design shortcut: courts and armies both hunted informers.',
  school: 'Scribal schools taught writing in Sumer by about 2000 BC; writing itself began as accounts at Uruk (about 3100 BC) and in Egypt soon after.',
  library: 'Ashurbanipal\'s library at Nineveh (7th century BC) and the Library of Alexandria (about 295 BC) gathered texts and scholars. Universities came later: Bologna in the 11th century, with al-Qarawiyyin (859) and Nalanda (5th century) older in their own traditions.',
  hospital: 'Roman forts had valetudinaria (military hospitals); Baghdad\'s bimaristan (about 805) and Byzantine xenones cared for the sick. Rest and care near the camp saved more men than the field surgeon.',
  temple: 'Temples are older than cities (Göbekli Tepe, about 9500 BC). Armies prayed and took omens before battle; belief steadied soldiers: that is zeal.',
  bakery: 'Egypt had bakeries in the Bronze age; bread turned the same harvest into steadier food for towns and armies.',
  amphi: 'Rome\'s Colosseum opened in AD 80 with a hundred days of games. Games kept a city content; gladiators fought there, never in the legions.',
  pasture: 'Sheep were the wealth of medieval England: wool was its great export. A sheep was shorn once a year, in late spring, and gave one to two pounds of wool; lambs came in spring.',
  weaver: 'Before machines, spinning was the bottleneck: a Roman toga took about 900 hours of spinning by hand. Weaving was quicker, so a weaver always waited on the spinners.',
  brewery: 'Ale was made from malted barley: steeped, sprouted and dried, then mashed and fermented for a few days. Without hops it soured within weeks, so it was brewed often and drunk young.',
  bizc: 'Merchants kept warehouses and counting houses where goods were stored, weighed and loaded: the Hanseatic Kontor and the caravanserai did this job.',
  tpost: 'Trade routes had fixed stopping places: wells, fords, markets and caravanserais. Whoever held them taxed every merchant who passed.',
  granary: 'Rats live in wooden grain stores and carry the fleas that spread plague. Stone granaries kept them out.',
  cleanwater: 'Dirty water spreads dysentery and cholera. The Romans brought clean water from the hills and settled it in tanks; it was proved only in 1854 that a pump could spread disease.',
  medschool: 'Medical schools such as Salerno and Montpellier trained physicians from written knowledge. They could not cure plague, but care and quarantine saved lives.',
  stop: 'Spice did not grow in Europe: pepper, cinnamon and cloves came along the caravan and sea routes from Asia, and sold for many times what they cost where they grew.',
  dock: 'Every river and lake town had landing stages: fishing boats and ferries tied up at wooden piers, and the catch was sold on the quay.',
  tower: 'Every walled people built towers: height gives sight and range. Jericho\'s tower stood about 8.5 m high around 8000 BC.',
  wall: 'Walls are among the oldest defences: Jericho had one about 8000 BC. They delay an attacker so defenders can shoot.',
  gate: 'A wall nobody can pass is a prison. Every walled city had gates, the weak point and the guarded point.',
  wonder: 'Each civilisation\'s great work: built to be seen, and costly enough to show a state at its height.',
  vil: 'Every economy is people doing work. More hands bring more of everything, until food or houses run out.',
  scout: 'Armies sent riders ahead to find water, food and the enemy. Knowing the ground first was half of every campaign.',
  envoy: 'Heralds were sacred in most cultures; harming one was a grave offence, though Herodotus tells of Persian heralds killed at Athens and Sparta.',
  caravan: 'Old Assyrian donkey caravans ran tin and cloth to Kanesh about 1900 BC; Han envoys opened the western silk routes about 138 BC. Pay grew with distance, and so did the risk.',
  spy: 'Hittite spies misled Ramesses II before Kadesh (1274 BC); the Art of War (Warring States China) gives spies a chapter; India\'s Arthashastra (its date is disputed) gives them many.',
  priest: 'Priests marched with armies for sacrifice and omens (Roman haruspices, Spartan pre-battle rites, medieval chaplains). They steadied men; physicians healed them.',
  medic: 'Roman medici and capsarii (bandagers) worked in the field; the Byzantine Strategikon (about 600) paid men to carry the wounded back.',
  spear: 'The spear is the oldest weapon of war. A line of spears stops horses, from the Sumerian phalanx on the Stele of the Vultures (about 2450 BC) to the Greek hoplite and the Scottish schiltron.',
  sword: 'Bronze swords appear about 1600 BC; heavy infantry with sword and shield won the close fight from Egypt to China.',
  archer: 'Bows are Stone-age (Ötzi carried a yew bow about 3300 BC). Arrows reach what spears cannot, but archers die to anything that closes with them.',
  jav: 'Javelin men (Greek peltasts, Roman velites, Iberian skirmishers) ran in, threw and ran off: the bane of slow archers.',
  crossbow: 'China fielded crossbows by the 4th century BC (first battle on record: Maling, 341 BC); Europe took them up again from the 10th century. Little training, great punch, slow to load.',
  chariot: 'The spoked-wheel chariot appeared about 2000 BC; Egyptians and Hittites fought with thousands at Kadesh (1274 BC). Riders replaced it once horses were bred big enough.',
  cata: 'Fully armoured horse and rider: Parthian and Seleucid cataphracts from about the 2nd century BC; Sasanian and Byzantine heavy cavalry after them.',
  harcher: 'Scythians, Parthians, Huns and Mongols shot from the saddle; the Parthian shot (firing while riding away) beat Crassus at Carrhae (53 BC).',
  elephant: 'India used war elephants for centuries; Chandragupta Maurya traded 500 to Seleucus (about 305 BC); Hannibal crossed the Alps with them. They could panic and turn on their own side.',
  ram: 'Battering rams under a roof, against fire and arrows, broke gates and walls from Assyria to Rome.',
  stower: 'Siege towers let archers shoot down on the walls: Assyrian reliefs show them, and Demetrius built a giant one (the Helepolis) at Rhodes in 305 BC.',
  catapult: 'Dionysius of Syracuse\'s engineers built the first catapults about 399 BC; torsion engines followed, first recorded at Tyre (332 BC).',
  ballista: 'Greek and Roman bolt-throwers (the scorpio, later the ballista) shot soldiers at long range; they were field artillery as well as siege engines.',
  treb: 'The traction trebuchet was Chinese (4th century BC); the counterweight trebuchet is described firmly in 1187, and threw heavier stones farther than any earlier engine.',
  legion: 'Rome\'s legions fought with pilum and gladius, and also built the empire\'s roads, forts and walls: Hadrian\'s Wall was largely raised by legionaries from AD 122.',
  hanxbow: 'Han armies fielded crossbows by the tens of thousands: one arsenal list from 13 BC counts over 11,000, with bronze triggers cast to a standard pattern.',
  immortal: 'Herodotus says the Persian king\'s guard of 10,000 was never allowed to fall below strength, so the Greeks called them Immortals. They carried spear, bow and wicker shield.',
  mongolha: 'A Mongol rider went to war with three or four horses and changed mounts to keep moving for days; the khans\' armies outpaced every enemy on the continent.',
  mauryael: 'A Greek envoy at Chandragupta\'s court reported that horses and elephants were the king\'s monopoly; the royal corps was the largest of its day.',
  malihorse: 'Al-Umari (about 1340) reported that the Mansa of Mali kept a standing cavalry and gave his chiefs horses; Ibn Battuta saw mounted commanders with bows.',
  // research
  axes: 'Ground and polished stone axes cleared the first fields; copper and bronze edges came later.',
  picks: 'Neolithic flint miners dug shafts at Grimes Graves (about 2600 BC) with red-deer antler picks.',
  coppice: 'Coppicing and pollarding gave steady poles and firewood from the same stools for generations.',
  plough: 'The scratch plough (ard), about 4000 to 3000 BC, multiplied what one farmer could work.',
  masonry: 'Cut stone and mortar outlast timber and earth: Egyptian and Mesopotamian builders led.',
  drill: 'Drilled soldiers hold together. Egypt\'s New Kingdom, the Greek city-states and Rome all drilled.',
  bronze: 'The first metal weapons outclassed stone and wood.',
  leather: 'Hardened leather and quilted linen turned blows long before metal armour.',
  composite: 'Horn, wood and sinew glued together: the composite bow (Bronze age) shot farther than a simple bow of its size.',
  horses: 'Assyrian and Persian studs bred bigger, faster horses; Persia\'s Nisean horses were famous.',
  writing: 'Writing lets knowledge be kept and passed on instead of rediscovered.',
  maths: 'Babylonian base-60 tables (about 1800 BC) and Euclid (about 300 BC) gave engineers angles and ranges.',
  iron: 'Iron is cheaper and keener than bronze, and it spread because ore is common.',
  chain: 'Mail was a Celtic invention (about the 3rd century BC) that Rome adopted as the lorica hamata.',
  machic: 'Machicolations, openings in an overhanging parapet to drop or shoot down at attackers, spread through European and Crusader castles from the 12th century.',
  slits: 'Loopholes appear in Hellenistic towers and Roman forts; the cross-shaped arrow loop is a 12th-century castle feature.',
  deep: 'Rome\'s mines at Rio Tinto went down hundreds of feet, drained by water wheels.',
  phalanx: 'The hoplite phalanx (from the 7th century BC) and Macedon\'s 18-foot sarissa (Philip II, 4th century BC) made a wall of spears.',
  cavalry: 'In the Iron age, bigger horses let riders fight from the saddle, and the chariot faded.',
  medicine: 'The Edwin Smith papyrus (about 1600 BC), Hippocrates (about 400 BC), Galen (about AD 170) and Sushruta taught observing and treating wounds.',
  architecture: 'Imhotep\'s pyramid (about 2650 BC) and Vitruvius\'s ten books (about 25 BC) set down how to plan, measure and build.',
  roads: 'Persia\'s Royal Road had 111 staging posts; Rome\'s Via Appia (312 BC) began a network of paved roads that armies and merchants shared.',
  coinage: 'Lydia struck the first coins (about 600 BC); China cast its own. A standard coin made every trade cheaper.',
  rotation: 'The three-course rotation spread in Carolingian Europe in the 9th century. Older textbooks said it raised yields by a third; historians now doubt the figure.',
  heavyplough: 'The heavy mouldboard plough opened northern Europe\'s clay soils between the 6th and 11th centuries; Han China had iron mouldboards far earlier.',
  wheelbarrow: 'The wheelbarrow was Chinese (about AD 100) and reached Europe by the 12th century; one worker moved twice the load.',
  pikesquare: 'Swiss pike squares (14th and 15th centuries) beat Burgundy\'s knights; the details of their early battles are argued.',
  arms: 'Men-at-arms, armoured foot and dismounted knights, decided many late-medieval fields.',
  longbow: 'The longbow, probably Welsh in origin, won at Crécy (1346) and Agincourt (1415); good ones drew 150 to 180 pounds.',
  knighthood: 'Feudal knights, from the 11th century, carried the cataphract\'s heavy charge into the Middle Ages.',
  plate: 'Full plate armour (14th and 15th centuries) turned most blades and many arrows.',
  fortify: 'Thick curtain walls and towers (Constantinople\'s Theodosian walls, 413; Krak des Chevaliers) turned a town into a fortress that took months to break.',
  castle: 'The castle joined keep, walls and garrison into one strongpoint and defined war in Europe for centuries. Rulers built them in conquered lands to hold them: Norman England, Edward I in Wales. The word comes from the Latin castellum, a fort.',
  // finds
  chest: 'People buried their wealth in troubled times; hoards like Hoxne in England were found centuries later.',
  ruins: 'Abandoned cities held old knowledge: much of Greek science reached Europe through Arabic copies kept elsewhere.',
  cemetery: 'Grave goods drew robbers in every age: almost every Egyptian tomb was robbed in antiquity.',
  camp: 'Brigands haunted every trade route; merchants hired guards, and states hunted bandits along them.',
  den: 'Bears and wolves were real dangers in the forests of Europe and Asia well into the Middle Ages.',
  shrine: 'Holy sites drew pilgrims and gifts, and rulers fought to hold them (Delphi, Jerusalem, Mecca, Bodh Gaya).',
  vagabonds: 'Mercenaries are as old as armies: Xenophon\'s Ten Thousand were Greeks hired by a Persian prince.',
  wayfarer: 'Towns grew by newcomers: settlers, refugees and travellers who stayed.',
  // civilisations' wonders
  'wonder:roman': 'The Flavian Amphitheatre, opened by Titus in AD 80 with a hundred days of games, seated about 50,000 Romans.',
  'wonder:han': 'Weiyang Palace, completed about 200 BC in Chang\'an, was the seat of Han emperors for two centuries; its walls ran about 14 km. Only the platforms survive, so its look here is a reconstruction.',
  'wonder:persian': 'Darius I founded Persepolis in 518 BC; in its Apadana hall, delegations from across the empire brought tribute to the king.',
  'wonder:mongol': 'At Karakorum, about 1254, the Parisian smith Guillaume Boucher built Möngke Khan a silver tree that poured four drinks for the court, as the friar William of Rubruck reported.',
  'wonder:maurya': 'Ashoka began the Great Stupa at Sanchi in the 3rd century BC; later rulers cased it in stone and added its four carved gateways.',
  'wonder:mali': 'The Djinguereber Mosque in Timbuktu is traditionally dated to 1327, built by order of Mansa Musa after his pilgrimage. It still stands, rebuilt in the 1570s.',
  'bonus:roman': 'Legions did their own building: soldiers of three legions raised most of Hadrian\'s Wall from AD 122.',
  'bonus:han': 'The Han state made iron ploughshares from 117 BC, and new field systems spread; critics at the time called the state tools crude, so the gain here is modest.',
  'bonus:persian': 'Along the Royal Road, 111 staging posts linked Sardis to Susa, and relay riders carried messages across the empire.',
  'bonus:mongol': 'Each rider kept three or four horses and swapped them to cover long distances without tiring them.',
  'bonus:maurya': 'Megasthenes, a Greek envoy at the Maurya court about 300 BC, said horses and elephants belonged to the king alone.',
  'bonus:mali': 'Mali held the Bambuk goldfields. Mansa Musa spent so much gold in Cairo in 1324 that its value there fell for years.',
};

// What triggers what: when, then, why. Numbers come from the tables, so the text cannot drift from the game.
const TRIGGERS = () => [
  ['You start a game', `Pick your civilisation (${CIVK.map(k => CIVS[k].name).join(', ')}). The three computers take three of the others at random. Each civilisation has one unique soldier, one small bonus and its own wonder; the rest is shared.`, 'A real people, but the same rules for all: no civilisation is stronger on paper.'],
  ['You order a unit and the town is full', 'The order waits ("needs room") and nothing is lost. Room opens when a House, Apartment or Aqueduct finishes or a unit dies.', 'A town is as big as its shelter.'],
  ['The screen', `Top: food, wood, stone, gold, iron; the score (★, tap for the table); one pace button (×1, ×2, ×3, paused); ? for how to play. Bottom: Villagers and Army show how many you have of the most (${VILMAX} and ${ARMYMAX}), or "full" when your homes are. Bottom-left of the map: Home, season, weather, clock, zoom.`, 'Only what you act on stays in sight; the rest is a tap away.'],
  ['Messages and sound', 'Every message is 10 words or fewer, one at a time. Tips and Messages can each be turned off; warnings stay on. Sound follows your phone\'s silent switch.', 'A phone game is played in short looks, often in company.'],
  ['Room', `You start with room for ${BLD.keep.room}. A House adds ${BLD.house.room}, an Apartment ${BLD.apartment.room}, an Aqueduct ${BLD.aqueduct.room}. At most ${POPMAX} people: ${VILMAX} villagers and workers, ${ARMYMAX} soldiers.`, 'Town Centers the game readable on a phone, and every side has the same limits.'],
  ['Battalions, from a War Council', 'Research Command at a War Council for six battalions, Alpha to Zeta. Set what each holds there, by type; new soldiers fill them, the rest are the reserve. Then Formations: Line, Column, Wedge, Square.', 'An army that moves as one cannot guard and attack at once.'],
  ['Villager jobs: Food, Farm, Wood, Stone, Gold', 'The − and + under each job move one villager off or on. Food takes a free field first if one is within 160, else the nearest berries, game or fish (fish only within 150 of a dock). Farm takes free fields only.', 'You decide who does what.'],
  ['Hunting', `Villagers on Food hunt deer and boar near home: they throw javelins, the animal falls, and they butcher it where it lies (a deer gives ${UNIT.deer.meat * RICH | 0}, a boar ${UNIT.boar.meat * RICH | 0}). Boar fight back.`, 'Meat came before fields everywhere.'],
  ['You build', 'Press where it goes: the building waits above your finger and snaps flush beside your other buildings, side by side; buildings that train keep a walking lane around them. Green fits, red says why not. Let go, drag to adjust, then tap Build. Houses, fields and gates offer the next spot beside.', 'Rows that line up, no hidden gaps, and you never cover what you are placing.'],
  ['Everyone eats', `Every minute each villager eats a share (${(UPKEEP.share * 60).toFixed(2)} food), a foot soldier 1.5 shares, a rider or elephant 3 (horse fodder), a cart 2. One villager gathering food feeds about 8. With no food, work and damage drop by a quarter and nothing can be trained; nobody starves.`, 'Real towns and armies ate every day; an army\'s horses ate more than its men.'],
  ['You hold a vassal', 'Beat their army and stand at their Town Center, then Demand surrender; or, as the Fortress\'s ally and twice its strength, offer to be its overlord. Every 10 s you take the tax (light 10%, fair 20%, heavy 35% of what they gathered). Loyalty heads for 20 + your buildings near them (castle 20, town 15, market 10, tower, post, business center 6, field 2, others 3) + your soldiers there (0.5 each, up to 15) + enemies you killed near them (1 each, up to 20, fading) − the tax\'s resentment (0, 10, 30). Unrest moves by the tax push (0.3, 1.5, 4) minus loyalty/25. At 60 loyalty they send gifts; at 50 you get a quarter of their trade profit.', 'Rulers who protected and built up their subjects were paid more and kept them; those who only squeezed them faced revolt.'],
  ['Unrest reaches 100', 'A rebellion: a third of their villagers take up arms and their army turns on you. Kill three quarters of them and it is crushed (the rebels are lost); if they hold out 4 minutes, they are free. With two or more vassals, every minute there is a chance that all the restless ones rise together: the chance grows with their unrest and their number.', 'Overstretched empires fell to joint revolts.'],
  ['You take down a building', 'Half its cost comes back; whatever was waiting in it comes back in full. Cancel in the first 15% of the build returns all of it. The Town Center cannot be taken down.', 'Salvage, never a way to make money.'],
  ['Soldiers destroy a building', `Its destroyer takes ${PLUNDER * 100}% of what it cost. Taking a building down yourself pays the enemy nothing.`, 'Spoils of war, never worth more than the fight. Every side is paid the same way.'],
  ['A Town Center falls', `Whoever struck the last blow takes the whole stockpile and ${PLUNDER * 100}% of the cost of every building left standing.`, 'Conquerors took the treasury. A rich stockpile is a target.'],
  ['Score', `Always on screen, top right; tap it for the table. Score = People (civilians held, cost ÷ ${SCORE.unit}) + Army (soldiers held, cost ÷ ${SCORE.unit}) + Tech (research and ages paid, ÷ ${SCORE.tech}) + Buildings (standing, cost ÷ ${SCORE.bld}) + Wealth (everything gathered, traded, found and plundered, ÷ ${SCORE.wealth}). Losses come off because you no longer hold them.`, 'Every building and every worker counts toward something, the same way for every side.'],
  ['A timed game', 'Help → Game: Conquest (no limit), 30 minutes or 60 minutes. At the bell the highest score wins.', 'A guaranteed end, and a reason to build more than an army.'],
  ['A wonder is finished', `Every side is told. If it still stands ${WONDER_HOLD / 60} minutes later, its owner wins. The computers attack a rival\'s wonder at once.`, 'A wonder shows a state at its height; it is also a target.'],
  ['Finds in the wild', 'Each corner has the same: deer, a boar, a treasure chest under wolves, ruins held by bandits (a free research of your age), an old cemetery with grave robbers, a bear den, vagabonds to hire. Robbers\' camps sit at the four map edges; four shrines stand on the great lake. Guards stay near what they guard and attack whoever comes close. Kill them, then touch the find with any unit.', 'Taking what is far means fighting for it. The map is the same from every corner.'],
  ['Robbers', `Robbers attack caravans and villagers within ${UNIT.robber.raid} of their camp. Break the camp and its hoard is yours.`, 'Merchants hired guards because bandits were real.'],
  ['Shrines', `A priest that stands by a shrine for ${FINDS.shrine.capture} s takes it. A shrine pays its keeper ${FINDS.shrine.pay * 60} gold a minute. Another side's priest can take it back.`, 'Rulers fought to hold holy sites; pilgrims brought gifts.'],
  ['Wayfarers', `Every ${WAYFARER_EVERY / 60} minutes a wayfarer walks in from one map edge, in turn, toward the other side. The first unit of any side that meets him brings home a free villager.`, 'Towns grew by newcomers.'],
  ['The fantasy toggle', 'Help → World: real (default) or fantasy. Fantasy swaps the guards for dire wolves, goblins, skeletons and trolls, and the finds pay half again as much. Everything else stays the same.', 'Your call: history by default, legend if you like.'],
  ['Courthouse and spies', `The Courthouse trains spies; its guards shoot enemy spies within ${BLD.courthouse.rng}. A spy is seen by soldiers only within ${UNIT.spy.stealth[0]} and by towers, the Town Center and Courthouses within ${UNIT.spy.stealth[1]}. Near an enemy building it reads their stores, age, research and army.`, 'States watched for spies as long as they have had secrets.'],
  ['Sabotage', `A spy sent to an enemy building is used up. A field, drop-off, house or hospital loses ${SAB.burn * 100}% of its health; a building that trains or researches stops for ${SAB.stall} s and loses the job in hand. Town Center, towers, walls, gates and Courthouses cannot be sabotaged.`, 'A spy buys time; it never wins a war alone.'],
  ['Market', `Sell 100 food, wood or stone for gold (${SELL * 100}% of its worth; Coinage ${(SELL + 0.1) * 100}%) or buy 100 for gold (${BUY * 100}%). The same prices for every side; a round trip always loses.`, 'The margin is the merchant\'s cut.'],
  ['Caravans', `A caravan walks from one of your Markets to the farthest other one and earns distance² ÷ ${TRADE_DIV}, at most ${TRADE_CAP} gold, on arrival. Kill an enemy caravan and its load is yours.`, 'Silk-road pay grew with distance, and so did the danger.'],
  ['Unit lines and tiers', 'Some research upgrades a unit in place and renames it: Spearman → Hoplite (Phalanx) → Pikeman (Pike square); Swordsman → Man-at-arms; Archer → Longbowman; Chariot → Horseman (Cavalry); Cataphract → Knight (Knighthood); Arquebusier → Musketeer (Musket). Every one you have is upgraded at once.', 'Armies changed their kit, not their soldiers.'],
  ['Counters', 'Spears beat anything on horseback; riders beat archers and siege; archers beat foot; javelins beat archers; crossbows and guns beat armour; swords beat foot and buildings; ballistae beat elephants. The unit cards say who beats whom.', 'Every weapon had its answer.'],
  ['Siege', 'Rams, catapults, trebuchets and bombards attack only buildings. Siege towers and ballistae shoot soldiers too. Arrows glance off rams and siege towers.', 'Soldiers hit walls slowly; real armies brought engines.'],
  ['Stances', `In the Army card a battalion takes a stance. Shield wall: foot soldiers who do not shoot take ${Math.round((1 - STANCE[1].hit) * 100)}% less damage and march ${Math.round((1 - STANCE[1].spd) * 100)}% slower. Skirmish: shooters step back from anyone who comes within ${KITE} while they reload. A horse archer always skirmishes. The computers use them too: their shooters skirmish, their foot at home hold a wall.`, 'The phalanx and the shield wall were slow and hard to break; skirmishers and horse archers fought by not being caught (Carrhae, 53 BC).'],
  ['Hit from behind', `A foot soldier or rider struck from behind the way it faces takes ${Math.round((FLANK - 1) * 100)}% more damage. Shooters do not get it. Splitting the army to catch a line from two sides pays.`, 'Armies lost most men when their line was turned: Cannae, 216 BC.'],
  ['Heavy blows', 'Elephants, cataphracts and trebuchets drive what they hit back a few steps, and it flashes white.', 'Elephants and armoured charges broke formations by weight.'],
  ['Quick send', 'Tap bare ground: pick how many of each type, then Send. Tap an enemy building or soldier: the same, then Attack, with the odds. With battalions, pick one first.', 'Commands should cost one touch.'],
  ['The Fortress\'s job', `Every ${CONTRACT.every / 60} minutes the Fortress offers ${costText(CONTRACT.pay)} to the first side to take one guarded find, within ${CONTRACT.secs / 60} minutes. A gold ring marks it. The computers go for it too.`, 'Strong towns hired outsiders to clear the roads.'],
  ['The ground remembers', 'Where people fell, where buildings burned and where villagers walk a lot, the ground shows it. It is for looks only and is not saved.', 'Battlefields and trodden roads stayed visible for years.'],
  ['Hold ground', 'In the Army card, Hold ground makes the picked battalion fight only what comes within reach and not chase.', 'A line that chases a lone rider breaks itself.'],
  ['Temple: Zeal', `With a Temple and a priest near the battalion, Zeal costs ${ZEAL.cost.g} gold and makes it hit ${Math.round((ZEAL.mul - 1) * 100)}% harder for ${ZEAL.secs} s. Once every ${ZEAL.cd / 60} minutes per side. An Amphitheatre halves the cost and shortens the rest.`, 'Belief steadied armies, but only so far.'],
  ['Hospital and medics', `Soldiers within ${BLD.hospital.hrng} of a Hospital or ${UNIT.medic.hrng} of a medic heal 3 health a second. The best one in reach counts. Medicine makes it 50% faster.`, 'Care near the camp saved more men than the field surgeon.'],
  ['A building of yours is damaged: tap it, then Repair', 'A villager mends it: a full repair takes three times the build time and costs a quarter of the building, paid as it goes.', 'Mending costs less than rebuilding, and it takes hands.'],
  ['Soldiers come within 70 of a villager', `The villager runs into the nearest tower with room (up to ${SHELTER.arrows.tower}) or the Town Center (up to ${SHELTER.arrows.keep} arrows) and adds an arrow, +1 damage each. It comes out when no enemy soldier is within ${SHELTER.clear} of it. A tower also sounds the horn when foes first come in range.`, 'People sheltered inside a fortress and helped defend it.'],
  ['You pay for an age at the Town Center', `Bronze ${AGES[1].t} s, Classical ${AGES[2].t} s, Medieval ${AGES[3].t} s, Gunpowder ${AGES[4].t} s. It opens the next buildings, soldiers and research.`, 'Time is the price of progress.'],
  ['You hit someone you are at peace with or allied to', 'It is an act of war: war is declared, an alliance breaks.', 'Same rule for all four sides.'],
  ['You send an emissary (Bronze age)', 'It rides to the Fortress. At war: killed. Allied elsewhere: sent back. If you are its biggest threat and clearly stronger: sent back with nothing. If you are weaker than half its biggest threat: terms of 150 gold. Otherwise: an alliance.', 'A neutral state allies with whoever raises its odds of surviving.'],
  ['The Fortress is your ally', 'Every 45 s it sends part of what it has above 200. It sends soldiers when your town is attacked and its own is safe.', 'An ally who shares is worth having.'],
  ['A computer decides to attack', 'It compares its power with the enemy\'s: odds = r²/(1+r²), the square law of aimed fire (Lanchester, 1916, a modern model). It goes only if the odds beat its nerve: Raiders .5, Rivals .65, the Fortress never. A wave that stalls goes home.', 'A rule of thumb, not history: ancient melee followed the square law less well.'],
  ['Trees stand in the way', 'Forest blocks people, carts and armies. A tree can be cut only from open ground beside it, so a forest is worked from its edge inward; a felled tree opens its ground. Box trees with ⬚ to send villagers to cut a road.', 'Old forests were barriers: roads were cut through them, and armies kept to the roads.'],
  ['The seasons turn', 'Spring: sheep are shorn and lambs born, and the year\'s harvest is set (about one year in six poor, −30%; one in twenty failed, −50%).', 'Real farming years: the harvest was the gamble that decided the year.'],
  ['The weather changes, every minute', 'Rain: marching 20% slower, bows reach 15% less, fires spread less. Drought (summer): fields give 30% less, fires spread fast. Frost (winter): stone buildings go up at half speed.', 'Wet roads were mud, wet bowstrings sagged, dry thatch burned, and mortar does not set in frost.'],
  ['A wooden building catches fire', 'Sabotage, summer lightning or sparks from a bakery or smithy. It burns down in about half a minute; two villagers run with buckets; it can spread to wooden buildings next to it. Stone does not burn.', 'Towns of timber and thatch burned often: London in 1212 and 1666.'],
